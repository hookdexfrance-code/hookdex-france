      new Promise((r) => setTimeout(r, 1200)),
    ]);
  } catch (e) {}
  const W = 1080, H = 1350, pad = 72, accent = "#FF5A36";
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0A0A0A"; ctx.fillRect(0, 0, W, H);
  let drewPhoto = false;
  const photo = await getCatchPhoto(c);
  if (photo) {
    try {
      const img = await loadImageEl(photo);
      const k = Math.max(W / img.width, H / img.height);
      ctx.drawImage(img, (W - img.width * k) / 2, (H - img.height * k) / 2, img.width * k, img.height * k);
      drewPhoto = true;
    } catch (e) {}
  }
  if (!drewPhoto) drawLogoMark(ctx, W / 2 - 340, 250, 680, "rgba(245,245,245,0.07)", "rgba(255,90,54,0.45)");
  const grad = ctx.createLinearGradient(0, H * 0.36, 0, H);
  grad.addColorStop(0, "rgba(10,10,10,0)");
  grad.addColorStop(0.35, "rgba(10,10,10,0.6)");
  grad.addColorStop(0.6, "rgba(10,10,10,0.88)");
  grad.addColorStop(1, "rgba(10,10,10,0.97)");
  ctx.fillStyle = grad; ctx.fillRect(0, H * 0.36, W, H * 0.64);
  ctx.textBaseline = "alphabetic";
  if (meta) {
    ctx.font = '600 28px "IBM Plex Sans", sans-serif';
    const label = `${meta.emoji} ${meta.label}`;
    const w = ctx.measureText(label).width + 40;
    ctx.fillStyle = "rgba(10,10,10,0.6)";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(pad, pad, w, 56, 28); else ctx.rect(pad, pad, w, 56);
    ctx.fill();
    ctx.fillStyle = "#F5F5F5"; ctx.fillText(label, pad + 20, pad + 38);
  }
  const y = H - 340;
  ctx.fillStyle = "#F5F5F5";
  const title = fitText(ctx, nom, W - 2 * pad, (sz) => `600 ${sz}px Oswald, "Arial Narrow", sans-serif`, 110, 60);
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 24;
  ctx.fillText(title, pad, y);
  ctx.restore();
  if (sp && sp.latin) { ctx.font = 'italic 34px "IBM Plex Sans", sans-serif'; ctx.fillStyle = "rgba(245,245,245,0.7)"; ctx.fillText(sp.latin, pad, y + 54); }
  const facts = [c.taille ? `${c.taille} cm` : "", c.poids ? `${String(c.poids).replace(".", ",")} kg` : "", c.quantite ? `× ${c.quantite}` : ""].filter(Boolean).join("    ");
  if (facts) { ctx.font = '600 52px "IBM Plex Mono", monospace'; ctx.fillStyle = accent; ctx.fillText(facts, pad, y + 136); }
  const session = c.sessionId ? state.sessions.find((x) => x.id === c.sessionId) || (state.activeSession && state.activeSession.id === c.sessionId ? state.activeSession : null) : null;
  const info = [c.date ? formatDate(c.date) : "", c.heure || "", session && session.lieu ? session.lieu : "", c.relachee ? "♻️ relâché(e)" : ""].filter(Boolean).join("  ·  ");
  if (info) {
    ctx.fillStyle = "rgba(245,245,245,0.85)";
    ctx.fillText(fitText(ctx, info, W - 2 * pad, (sz) => `400 ${sz}px "IBM Plex Sans", sans-serif`, 32, 26), pad, y + 198);
  }
  drawLogoMark(ctx, pad, H - 104, 64, "#F5F5F5", accent);
  ctx.font = '600 36px Oswald, "Arial Narrow", sans-serif';
  ctx.fillStyle = "#F5F5F5"; ctx.fillText("HookDex", pad + 82, H - 62);
  ctx.fillStyle = accent; ctx.fillText("France", pad + 82 + ctx.measureText("HookDex ").width, H - 62);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
  if (!blob) { showSnackbar("Impossible de créer l'image"); return; }
  const fileName = `hookdex-${normalizeText(nom).replace(/[^a-z0-9]+/g, "-")}-${c.date || "prise"}.jpg`;
  const file = new File([blob], fileName, { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: nom, text: `${nom}${c.taille ? " · " + c.taille + " cm" : ""}${c.poids ? " · " + c.poids + " kg" : ""} — HookDex France` });
      return;
    } catch (e) { if (e && e.name === "AbortError") return; }
  }
  downloadBlob(blob, fileName);
  showSnackbar("Image enregistrée dans tes téléchargements");
}

/* ---------- mise à jour de l'app ---------- */
const APP_VERSION = "3.1";
function checkForUpdate() {
  if (location.protocol === "file:" || navigator.onLine === false) return;
  // requête HEAD : ignorée par le service worker, elle interroge toujours GitHub
  fetch(location.href.split("#")[0], { method: "HEAD", cache: "no-store" }).then((res) => {
    if (!res.ok) return;
    const tag = res.headers.get("etag") || res.headers.get("last-modified");
    if (!tag) return;
    const known = localStorage.getItem("fdx_page_tag");
    localStorage.setItem("fdx_page_tag", tag);
    if (known && known !== tag) showSnackbar("Nouvelle version de HookDex disponible", "Mettre à jour", applyUpdate, 12000);
  }).catch(() => {});
}
async function applyUpdate() {
  try {
    if (window.caches) {
      for (const key of await caches.keys()) {
        const cache = await caches.open(key);
        for (const req of await cache.keys()) {
          const u = new URL(req.url);
          if (u.origin === location.origin && (u.pathname.endsWith("/") || u.pathname.endsWith(".html"))) await cache.delete(req);
        }
      }
    }
  } catch (e) {}
  location.reload();
}

/* ---------- démarrage ---------- */
render();
if (state.activeSession) startSessionTimerLoop();
const splash = document.getElementById("splash-screen");
if (splash) {
  setTimeout(() => {
    splash.classList.add("fade-out");
    setTimeout(() => { splash.remove(); checkNewAchievements(); }, 550);
  }, 900);
} else {
  checkNewAchievements();
}
if (window.matchMedia) {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (state.theme === "auto") render();
  });
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then((ok) => { if (!ok) navigator.storage.persist().catch(() => {}); }).catch(() => {});
}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
// Déplacement (vérifié) des anciennes photos vers IndexedDB, puis affichage
migrateInlinePhotos().then(() => hydratePhotos());
setTimeout(checkForUpdate, 5000);
checkPageAddress();
window.__fdxBooted = true;
</script>
