<style>
:root {
  --bg:#0A0A0A; --header:#131313; --card:#171717; --border:#2C2C2C;
  --text:#F5F5F5; --muted:#8C8C8C; --input:#0A0A0A;
  --accent:#FF5A36; --accent2:#C2431F; --track:#262626;
}
body.light {
  --bg:#FAFAFA; --header:#FFFFFF; --card:#FFFFFF; --border:#E2E2E2;
  --text:#111111; --muted:#6E6E6E; --input:#FAFAFA;
  --accent:#E8481F; --accent2:#B23A18; --track:#ECECEC;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; overscroll-behavior-y: contain; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  padding-bottom: 76px;
  min-height: 100vh;
}
.oswald { font-family: 'Oswald', 'Arial Narrow', sans-serif; }
.mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
button, input, select, textarea { font-family: inherit; }
a { color: inherit; }

header.app-header {
  position: sticky; top:0; z-index: 10; display:flex; justify-content:space-between; align-items:center;
  padding: 14px 18px; background: var(--header); border-bottom: 1px solid var(--border);
}
.header-left { display:flex; align-items:center; gap:8px; }
.header-title { font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; }
.header-title span { color: var(--accent); }
.theme-btn { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:7px 9px; cursor:pointer; font-size:16px; }

main.app-main { max-width: 560px; margin: 0 auto; padding: 18px 16px; }

.card { border:1px solid var(--border); border-radius:10px; padding:14px; background: var(--card); }
.hero-card { border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:18px;
  background: linear-gradient(135deg, var(--card) 0%, var(--header) 100%); }
.progress-row { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
.primary-btn { display:flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:8px;
  padding:12px 18px; font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; text-transform:uppercase;
  letter-spacing:0.03em; cursor:pointer; width:100%; background: var(--accent); color: var(--bg); }
.primary-btn:active { transform: scale(0.97); }
.stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:6px; }
.mini-stat { text-align:center; padding:14px 10px; }
.mini-stat .icon { margin-bottom:6px; font-size:16px; }
.mini-stat .value { font-family:'IBM Plex Mono',monospace; font-size:19px; }
.mini-stat .label { font-size:10.5px; color:var(--muted); margin-top:2px; }
.section-title { display:flex; align-items:center; gap:6px; margin:22px 0 10px; color:var(--muted); font-size:12px;
  text-transform:uppercase; letter-spacing:0.06em; }
.empty-hint { text-align:center; padding:30px 16px; border:1px dashed var(--border); border-radius:10px; color:var(--muted); font-size:13.5px; }
.link-card { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; font-size:13.5px;
  background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; }

.search-bar { display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:10px; padding:10px 12px;
  margin-bottom:14px; background:var(--card); }
.search-bar input { border:none; outline:none; background:transparent; font-size:14px; flex:1; color:var(--text); }
.chips-row { display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
.chip { background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:20px; padding:6px 13px;
  font-size:12px; cursor:pointer; white-space:nowrap; flex-shrink:0; }
.chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight:600; }

.dex-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.dex-card { display:flex; flex-direction:column; align-items:center; border:1px solid var(--border); border-radius:12px;
  padding:14px 8px; gap:2px; background:var(--card); cursor:pointer; text-align:center; }
.dex-card .icon-wrap { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  margin-bottom:8px; font-size:19px; }
.dex-card .name { font-size:13px; font-weight:600; color:var(--text); line-height:1.25; }
.dex-card .cat { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; }

.form-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.form-title { font-family:'Oswald',sans-serif; font-size:16px; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field label { font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); }
.field input, .field select, .field textarea {
  border:1px solid var(--border); border-radius:6px; padding:9px 11px; font-size:13.5px; width:100%;
  background:var(--input); color:var(--text);
}
.field textarea { min-height:60px; resize:vertical; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
.small-btn { display:inline-flex; align-items:center; gap:5px; background:transparent; border:1px solid var(--border);
  color:var(--muted); border-radius:7px; padding:8px 12px; font-size:12.5px; cursor:pointer; }
.icon-btn-flat { background:transparent; border:none; padding:4px; cursor:pointer; color:var(--muted); font-size:16px; }
.journal-top-row { display:flex; gap:8px; margin-bottom:14px; }
.gps-status { font-size:11.5px; color:var(--muted); margin-top:4px; }

nav.bottom-nav { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:8px 2px;
  background:var(--header); border-top:1px solid var(--border); z-index:10; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.nav-btn { background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:4px 5px; cursor:pointer; color:var(--muted); font-size:18px; flex:1; min-width:0; }
.nav-btn .label { white-space:nowrap; }
#leaflet-map { height: 340px; border-radius: 10px; border: 1px solid var(--border); z-index: 1; }
.map-fallback-item { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; }
.map-fallback-item a { color: var(--accent); text-decoration:none; font-size:12.5px; }
.nav-btn.active { color: var(--accent); }
.nav-btn .label { font-size:10px; font-family:'IBM Plex Sans',sans-serif; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.modal { width:100%; max-width:560px; max-height:85vh; overflow-y:auto; border:1px solid var(--border); border-top-left-radius:16px;
  border-top-right-radius:16px; padding:20px; background:var(--card); }
.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px; }
.modal-stat .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
.modal-stat .v { font-size:13.5px; color:var(--text); font-family:'IBM Plex Mono',monospace; margin-top:2px; }
.modal-row { margin-top:10px; }
.modal-row .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
.modal-row .v { font-size:13px; color:var(--text); margin-top:2px; line-height:1.45; }

.catch-card { border:1px solid var(--border); border-radius:10px; padding:14px; background:var(--card); margin-bottom:10px; }
.catch-card img { margin-top:8px; max-height:160px; width:100%; object-fit:cover; border-radius:8px; }
.catch-meta { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
.catch-note { font-size:13px; color:var(--text); margin-top:8px; border-top:1px solid var(--border); padding-top:8px; }

.bar-chart { display:flex; align-items:flex-end; gap:5px; height:140px; padding-top:10px; }
.bar-chart .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.bar-chart .bar { width:100%; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; }
.bar-chart .bar-label { font-size:9px; color:var(--muted); margin-top:4px; }
.season-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.season-card { text-align:center; }
.season-card .val { font-size:20px; font-family:'IBM Plex Mono',monospace; color:var(--accent); }
.season-card .lbl { font-size:11.5px; color:var(--muted); text-transform:capitalize; }

.ach-item { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.ach-item .check { font-size:20px; }
.ach-item .txt-title { font-family:'Oswald',sans-serif; font-size:15px; color:var(--text); }
.ach-item .txt-desc { font-size:12px; color:var(--muted); }

.install-banner { display:none; background: var(--card); border:1px solid var(--accent); border-radius:10px; padding:12px 14px;
  margin-bottom:16px; font-size:12.5px; color:var(--text); line-height:1.5; }
.install-banner.show { display:block; }
.install-banner b { color: var(--accent); }

#splash-screen { position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px; transition: opacity 0.5s ease; }
#splash-screen.fade-out { opacity:0; pointer-events:none; }
#splash-screen .splash-logo { animation: splash-pop 0.7s cubic-bezier(0.34,1.56,0.64,1); }
#splash-screen .splash-title { font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--text); opacity:0; animation: splash-fade 0.6s ease 0.3s forwards; }
#splash-screen .splash-sub { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:0.1em;
  text-transform:uppercase; opacity:0; animation: splash-fade 0.6s ease 0.5s forwards; }
@keyframes splash-pop { 0% { transform:scale(0.6); opacity:0; } 100% { transform:scale(1); opacity:1; } }
@keyframes splash-fade { to { opacity:1; } }
.fdx-logo-mark polygon { fill: var(--text); }
.fdx-logo-mark circle { fill: var(--accent); }

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius:3px; }

.fdx-toast {
  position:fixed; top:14px; left:50%; z-index:200; max-width:340px; width:calc(100% - 32px);
  transform:translate(-50%, -30px); opacity:0; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
  background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:12px 14px;
  display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,0.35);
}
.fdx-toast.show { transform:translate(-50%, 0); opacity:1; }
.fdx-toast-icon { font-size:24px; flex-shrink:0; }
.fdx-toast-title { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); }
.fdx-toast-label { font-family:'Oswald',sans-serif; font-size:15px; color:var(--text); margin-top:1px; }

.fdx-confetti-piece { position:fixed; top:-40px; z-index:150; pointer-events:none; will-change:transform, opacity; }
@keyframes fdx-confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity:1; }
  100% { transform: translateY(112vh) rotate(720deg); opacity:0; }
}

.cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.cal-nav-btn { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:16px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-weekday { text-align:center; font-size:10px; color:var(--muted); text-transform:uppercase; padding-bottom:4px; }
.cal-day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  border-radius:8px; border:1px solid var(--border); cursor:pointer; font-size:12px; position:relative; background:var(--card); color:var(--text); }
.cal-day.today { border-color:var(--accent); border-width:2px; }
.cal-day.selected { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.cal-day.empty { visibility:hidden; border:none; cursor:default; }
.cal-day .cal-moon { font-size:10px; line-height:1; }
.cal-day .cal-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); }
.cal-day.selected .cal-dot { background:var(--bg); }
.cal-detail { margin-top:16px; }

/* --- ajouts v2 --- */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible {
  outline:2px solid var(--accent); outline-offset:2px;
}
.nav-btn { transition: color 0.15s ease; }
.nav-btn.active span:first-child { transform: translateY(-1px); }
.fdx-snackbar {
  position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:210; transform:translate(-50%, 20px);
  opacity:0; transition: transform 0.25s ease, opacity 0.25s ease; pointer-events:none;
  width:calc(100% - 32px); max-width:420px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--text); color:var(--bg); border-radius:10px; padding:12px 14px; font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
}
.fdx-snackbar.show { transform:translate(-50%, 0); opacity:1; pointer-events:auto; }
.fdx-snackbar button { background:transparent; border:none; color:var(--accent); font-weight:600; font-size:13.5px; cursor:pointer; padding:4px 6px; }
.today-strip { display:flex; align-items:center; gap:12px; margin-bottom:18px; padding:12px 14px; }
.today-strip .moon { font-size:28px; line-height:1; }
.storage-bar { height:6px; border-radius:3px; background:var(--track); overflow:hidden; margin-top:8px; }
.storage-bar > div { height:100%; background:var(--accent); }
.lock-hint { border:1px dashed var(--border); border-radius:10px; padding:12px; margin-top:12px; }
.lock-hint .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
.lock-hint .v { font-size:13px; margin-top:2px; line-height:1.45; }
/* --- ajouts v3 --- */
.timeline { position:relative; height:22px; border-radius:6px; background:var(--track); overflow:hidden; margin-top:12px; }
.timeline .tl-day { position:absolute; top:0; bottom:0; background:rgba(255,196,64,0.14); }
body.light .timeline .tl-day { background:rgba(255,170,0,0.18); }
.timeline .tl-major, .timeline .tl-minor { position:absolute; border-radius:4px; background:var(--accent); }
.timeline .tl-major { top:4px; bottom:4px; }
.timeline .tl-minor { top:8px; bottom:8px; opacity:0.55; }
.timeline .tl-now { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--text); }
.tl-ticks { display:flex; justify-content:space-between; font-size:9.5px; color:var(--muted); margin-top:3px; font-family:'IBM Plex Mono',monospace; }
.sol-list { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin-top:10px; font-size:12px; color:var(--muted); }
.sol-list b { color:var(--text); font-weight:600; }
.sol-now { margin-top:10px; font-size:12.5px; color:var(--text); line-height:1.45; }
.sol-now b { color:var(--accent); }
.rating-dots { display:inline-flex; gap:3px; vertical-align:middle; }
.rating-dots i { width:7px; height:7px; border-radius:50%; background:var(--track); display:inline-block; }
.rating-dots i.on { background:var(--accent); }
.backup-card { border-color:var(--accent); margin-bottom:18px; font-size:12.5px; line-height:1.5; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.seg { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:14px; }
.seg button { flex:1; background:transparent; border:none; color:var(--muted); padding:8px 4px; font-size:12px; cursor:pointer; }
.seg button + button { border-left:1px solid var(--border); }
.seg button.active { background:var(--track); color:var(--text); font-weight:600; }
.catch-card img[data-photo-id]:not([src]) { display:block; height:160px; background:var(--track); }
.thumb { width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--track); }
.cal-day .cal-star { position:absolute; top:2px; right:4px; font-size:8px; color:var(--accent); }
.cal-day.selected .cal-star { color:var(--bg); }
.weather-status { font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.4; }
.leaflet-popup-content { font-family:'IBM Plex Sans',sans-serif; font-size:13px; }
.catch-actions { display:flex; gap:0; flex-shrink:0; }
.primary-btn:disabled { opacity:0.6; }

/* --- ajouts v3.1 --- */
.week-row { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
.week-day { background:transparent; border:1px solid transparent; border-radius:10px; padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text); cursor:pointer; font-family:inherit; min-width:0; }
.week-day.good { border-color:var(--accent); }
.week-day .wd { font-size:10px; color:var(--muted); text-transform:uppercase; }
.week-day .dn { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; }
.week-day .mo, .week-day .wx { font-size:15px; line-height:1.1; }
.week-day .rating-dots { gap:2px; }
.week-day .rating-dots i { width:5px; height:5px; }
.week-day .tp { font-size:11.5px; font-family:'IBM Plex Mono',monospace; }
.week-day .wi { font-size:9.5px; color:var(--muted); white-space:nowrap; }
.wx-now { font-size:12.5px; margin:0 4px 10px; line-height:1.45; }
.reg-hint { font-size:12px; margin-top:6px; line-height:1.45; }
.mystery-row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 0; background:transparent; border:none; color:var(--text); cursor:pointer; font-family:inherit; }
.mystery-row + .mystery-row { border-top:1px solid var(--border); }
.mystery-row .ico { width:38px; height:38px; border-radius:10px; background:var(--track); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }

/* --- v4 : allure « vraie appli » --- */
[hidden] { display:none !important; }
:root {
  --elev:#212121; --water:#3BA7D9; --water-dim:#2C6F90; --sun:#FFC857;
  --ok:#3FB27F; --bad:#EF5350; --warn:#E8A33D;
  --ok-soft:rgba(63,178,127,0.15); --bad-soft:rgba(239,83,80,0.15); --warn-soft:rgba(232,163,61,0.17); --info-soft:rgba(59,167,217,0.15);
  --accent-soft:rgba(255,90,54,0.13);
}
body.light {
  --elev:#F1F1F1; --water:#1E7FB2; --water-dim:#7FB3CF; --sun:#E0A100;
  --ok:#1E8A5A; --bad:#C9302C; --warn:#B7791F;
  --ok-soft:rgba(30,138,90,0.12); --bad-soft:rgba(201,48,44,0.10); --warn-soft:rgba(183,121,31,0.13); --info-soft:rgba(30,127,178,0.11);
  --accent-soft:rgba(232,72,31,0.10);
}
body { padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
.ico { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; vertical-align:middle; }
.ico.sm { width:18px; height:18px; }
.ico.xs { width:15px; height:15px; }
body:not(.light) .tiles-invert .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9); }

  const diffDays = (date.getTime() - knownNewMoon) / 86400000;
  let phase = (diffDays % synodicMonth) / synodicMonth;

}

  const emojis = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];

}

  if (phase < 0.03 || phase > 0.97) return "Nouvelle lune";
  if (phase < 0.22) return "Premier croissant";
  if (phase < 0.28) return "Premier quartier";
  if (phase < 0.47) return "Lune gibbeuse croissante";

/* ---------- astronomie hors ligne : soleil, lune, périodes solunaires ---------- */
const Astro = (() => {

  const declination = (l, b) => Math.asin(Math.sin(b) * Math.cos(obliq) + Math.cos(b) * Math.sin(obliq) * Math.sin(l));
  const altitude = (H, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));

  function moonCoords(d) {

    const l = L + rad * 6.289 * Math.sin(M), b = rad * 5.128 * Math.sin(F);

    const d = toDays(new Date(t)), c = body === "sun" ? sunCoords(d) : moonCoords(d);

  function dayEvents(body, dayStart, lat, lng) {

    const periods = [];
    if (moon.transit) periods.push({ type: "majeure", label: "Lune au zénith", center: moon.transit, start: moon.transit - H, end: moon.transit + H });
    if (moon.underfoot) periods.push({ type: "majeure", label: "Lune au nadir", center: moon.underfoot, start: moon.underfoot - H, end: moon.underfoot + H });
    if (moon.rise) periods.push({ type: "mineure", label: "Lever de lune", center: moon.rise, start: moon.rise - H / 2, end: moon.rise + H / 2 });
    if (moon.set) periods.push({ type: "mineure", label: "Coucher de lune", center: moon.set, start: moon.set - H / 2, end: moon.set + H / 2 });

/* ---------- photos : IndexedDB (beaucoup plus de place que les ~5 Mo du stockage local) ---------- */
const PhotoDB = (() => {
  let dbPromise = null;
  function open() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        try {
          if (!window.indexedDB) { reject(new Error("indisponible")); return; }
          const req = indexedDB.open("hookdex", 1);
          req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains("photos")) req.result.createObjectStore("photos"); };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error || new Error("erreur"));
          req.onblocked = () => reject(new Error("bloqué"));
        } catch (e) { reject(e); }
      });
      dbPromise.catch(() => {});
    }
    return dbPromise;
  }
  function run(mode, work) {
    return open().then((db) => new Promise((resolve, reject) => {
      let result;
      const tx = db.transaction("photos", mode);
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error || new Error("transaction"));
      tx.onabort = () => reject(tx.error || new Error("annulée"));
      work(tx.objectStore("photos"), (r) => { result = r; });
    }));
  }
  return {
    ok: () => open().then(() => true, () => false),
    get: (id) => run("readonly", (store, done) => { const r = store.get(String(id)); r.onsuccess = () => done(r.result || null); }),
    put: (id, data) => run("readwrite", (store) => { store.put(data, String(id)); }),
    putMany: (entries) => run("readwrite", (store) => { entries.forEach(([id, data]) => store.put(data, String(id))); }),
    del: (id) => run("readwrite", (store) => { store.delete(String(id)); }),
    clear: () => run("readwrite", (store) => { store.clear(); }),
  };
})();

function catchHasPhoto(c) { return !!(c && (c.photo || c.hasPhoto)); }

  if (!c) return Promise.resolve(null);
  if (c.photo) return Promise.resolve(c.photo);
  if (!c.hasPhoto) return Promise.resolve(null);
  const cached = photoCache.get(String(c.id));
  if (cached) return Promise.resolve(cached);
  return PhotoDB.get(c.id).then((data) => { if (data) cachePhoto(c.id, data); return data; }).catch(() => null);
}
function photoImgTag(c, cls) {
  const clsAttr = cls ? ` class="${cls}"` : "";
  if (c.photo) return `<img src="${c.photo}" alt=""${clsAttr}>`;
  if (!c.hasPhoto) return "";
  const cached = photoCache.get(String(c.id));
  return `<img data-photo-id="${escapeHtml(String(c.id))}" alt=""${clsAttr}${cached ? ` src="${cached}"` : ""}>`;
}
function hydratePhotos() {

// Copie les photos intégrées (ancien format) dans IndexedDB, puis RELIT chaque photo avant d'alléger le carnet.
async function movePhotosToDb(list) {
  const moved = new Map();
  const inline = list.filter((c) => c && c.id && typeof c.photo === "string" && c.photo.startsWith("data:"));
  if (inline.length === 0 || !(await PhotoDB.ok())) return moved;
  await PhotoDB.putMany(inline.map((c) => [c.id, c.photo]));
  for (const c of inline) {
    const back = await PhotoDB.get(c.id);
    if (back === c.photo) { moved.set(String(c.id), c.photo); cachePhoto(c.id, c.photo); }
  }
  return moved;
}
function stripMovedPhotos(list, moved) {
  if (!moved.size) return list;
  return list.map((c) => (c && moved.has(String(c.id)) && c.photo === moved.get(String(c.id)) ? { ...c, photo: "", hasPhoto: true } : c));
}
async function migrateInlinePhotos() {
  try {
    const moved = await movePhotosToDb(state.catches);
    if (moved.size === 0) return;
    const updated = stripMovedPhotos(state.catches, moved);
    if (saveCatches(updated)) state.catches = updated;
  } catch (e) { /* au moindre souci, les photos restent simplement où elles étaient : rien n'est perdu */ }
}

/* ---------- calculs stats ---------- */
function timeOfDayBucket(heure) {
  if (!heure) return null;
  const h = parseInt(String(heure).split(":")[0], 10);
  if (isNaN(h)) return null;
  if (h >= 5 && h < 11) return "🌅 Matin (5h-11h)";
  if (h >= 11 && h < 14) return "☀️ Midi (11h-14h)";
  if (h >= 14 && h < 18) return "🌤️ Après-midi (14h-18h)";
  return "🌙 Soir / nuit (18h-5h)";
}
function pressureBucket(pression) {
  const p = parseFloat(pression);
  if (isNaN(p)) return null;
  if (p < 1010) return "Basse (< 1010 hPa)";
  if (p <= 1020) return "Moyenne (1010-1020 hPa)";
  return "Haute (> 1020 hPa)";
}
function moonBucketLabel(phase) {
  if (phase < 0.125 || phase >= 0.875) return "🌑 Nouvelle lune";
  if (phase < 0.375) return "🌓 Premier quartier";
  if (phase < 0.625) return "🌕 Pleine lune";
  return "🌗 Dernier quartier";
}
function tallyField(catches, field) {
  const counts = {}, labels = {};
  catches.forEach((c) => {
    const raw = (c[field] || "").trim();
    if (!raw) return;
    const key = normalizeText(raw);
    counts[key] = (counts[key] || 0) + 1;
    if (!labels[key]) labels[key] = raw;
  });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([key, count]) => [labels[key], count]);
  return { top, total };
}
function computeConditionsAnalysis() {
  if (state.catches.length < 5) return null;
  const timeCounts = {}, moonCounts = {}, pressureCounts = {}, meteoWords = {};
  const stopWords = new Set(["avec","sans","tres","assez","plutot","dans","pour","comme"]);
  state.catches.forEach((c) => {
    const tb = timeOfDayBucket(c.heure);
    if (tb) timeCounts[tb] = (timeCounts[tb] || 0) + 1;
    if (c.date) {
      const [y, m, d] = c.date.split("-").map(Number);
      const phase = getMoonPhase(new Date(y, m - 1, d, 12));
      const mb = moonBucketLabel(phase);
      moonCounts[mb] = (moonCounts[mb] || 0) + 1;
    }
    const pb = pressureBucket(c.pression);
    if (pb) pressureCounts[pb] = (pressureCounts[pb] || 0) + 1;
    if (c.meteo) {
      normalizeText(c.meteo).split(/[^a-zàâäéèêëîïôöùûüç]+/).filter((w) => w.length > 3 && !stopWords.has(w))
        .forEach((w) => { meteoWords[w] = (meteoWords[w] || 0) + 1; });
    }
  });
  const sortDesc = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1]);
  return {
    time: sortDesc(timeCounts),
    moon: sortDesc(moonCounts),
    pressure: sortDesc(pressureCounts),
    meteo: sortDesc(meteoWords).slice(0, 4),
    appat: tallyField(state.catches, "appat"),
    leurre: tallyField(state.catches, "leurre"),
    hamecon: tallyField(state.catches, "hameçon"),
    totalWithHeure: Object.values(timeCounts).reduce((a, b) => a + b, 0),
    totalWithDate: state.catches.filter((c) => c.date).length,
    totalWithPression: Object.values(pressureCounts).reduce((a, b) => a + b, 0),
  };
}
function computeStats() {
  if (state.catches.length === 0) return null;
  const countByEspece = {};
  let heaviest = null, longest = null;
  const dates = new Set();
  const byMonth = Array(12).fill(0);
  const bySeason = { hiver:0, printemps:0, ete:0, automne:0 };
  for (const c of state.catches) {
    const qty = parseInt(c.quantite, 10);
    countByEspece[c.especeId] = (countByEspece[c.especeId] || 0) + (qty > 0 ? qty : 1);
    const p = parseFloat(c.poids), t = parseFloat(c.taille);
    if (!isNaN(p) && (!heaviest || p > parseFloat(heaviest.poids))) heaviest = c;
    if (!isNaN(t) && (!longest || t > parseFloat(longest.taille))) longest = c;
    if (c.date) {
      dates.add(c.date);
      const m = new Date(c.date + "T00:00:00").getMonth();
      byMonth[m]++;
      bySeason[seasonOf(m + 1)]++;
    }
  }
  const rankedEspeces = Object.entries(countByEspece).sort((a, b) => b[1] - a[1]);
  const topEntry = rankedEspeces[0];
  return {
    topEspece: topEntry ? { id: topEntry[0], count: topEntry[1] } : null,
    topSpeciesList: rankedEspeces.slice(0, 5).map(([id, count]) => ({ id, count })),
    heaviest, longest, totalPrises: state.catches.length, sorties: dates.size, byMonth, bySeason,
  };
}
function computeStreak() {
  const catchDays = state.catches.map((c) => c.date).filter(Boolean);
  const sessionDays = state.sessions.map((s) => localDateStr(new Date(s.startTs)));
  const activeDay = state.activeSession ? [localDateStr(new Date(state.activeSession.startTs))] : [];
  const days = [...new Set([...catchDays, ...sessionDays, ...activeDay])].sort().reverse();
  if (days.length === 0) return 0;
  let count = 0;
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  const fmt = (d) => localDateStr(d);
  let expected = fmt(cursor);
  if (days[0] !== expected) {
    cursor.setDate(cursor.getDate() - 1);
    expected = fmt(cursor);
    if (days[0] !== expected) return 0;
  }
  for (const d of days) {
    if (d === expected) { count++; cursor.setDate(cursor.getDate() - 1); expected = fmt(cursor); }
    else break;
  }
  return count;
}

/* ---------- notifications de succès (toasts + confettis) ---------- */
function loadSeenAchievements() { try { return JSON.parse(localStorage.getItem("fdx_seen_achievements_v2") || "[]"); } catch(e) { return []; } }
function saveSeenAchievements(arr) { localStorage.setItem("fdx_seen_achievements_v2", JSON.stringify(arr)); }
let seenAchievementIds = new Set(loadSeenAchievements());
function checkNewAchievements() {
  const unlocked = unlockedAchievements();
  const currentIds = new Set(unlocked.map((a) => a.id));
  const newOnes = unlocked.filter((a) => !seenAchievementIds.has(a.id));
  // On resynchronise le suivi sur l'état réel : un succès perdu (ex. prise supprimée) pourra se redéclencher plus tard
  seenAchievementIds = currentIds;
  saveSeenAchievements([...seenAchievementIds]);
  if (newOnes.length === 0) return;
  spawnFishConfetti(Math.min(12 + newOnes.length * 6, 40));
  newOnes.forEach((a) => queueAchievementToast(a));
}
function spawnFishConfetti(count) {
  const isLight = document.body.classList.contains("light");
  const colors = isLight ? ["var(--accent)", "#1A1A1A", "#5A5A5A"] : ["var(--accent)", "#F5F5F5", "#9A9A9A"];
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "fdx-confetti-piece";
    const size = 12 + Math.random() * 14;
    const left = Math.random() * 100;
    const duration = 1.8 + Math.random() * 1.6;
    const delay = Math.random() * 0.5;
    const color = colors[Math.floor(Math.random() * colors.length)];
    el.style.left = left + "vw";
    el.style.animation = `fdx-confetti-fall ${duration}s ease-in ${delay}s forwards`;
    el.innerHTML = `<svg width="${size}" height="${size * 0.75}" viewBox="0 0 120 90"><polygon points="14,45 66,18 108,45 66,72" fill="${color}"></polygon><polygon points="108,45 118,30 118,60" fill="${color}"></polygon></svg>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (duration + delay) * 1000 + 150);
  }
}
let toastQueue = [];
let toastShowing = false;
function queueAchievementToast(achievement) {
  toastQueue.push(achievement);
  if (!toastShowing) showNextToast();
}
function showNextToast() {
  const a = toastQueue.shift();
  if (!a) { toastShowing = false; return; }
  toastShowing = true;
  buzz([40, 60, 40]);
  const el = document.createElement("div");
  el.className = "fdx-toast";
  el.innerHTML = `<span class="fdx-toast-icon">🏆</span><div><div class="fdx-toast-title">Succès débloqué</div><div class="fdx-toast-label">${escapeHtml(a.label)}</div></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => { el.remove(); showNextToast(); }, 350);
  }, 2600);
}

function buzz(pattern) {
  try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(pattern); } catch (e) {}
}

/* ---------- snackbar (message bas d'écran, avec action facultative) ---------- */
let snackbarTimer = null;
let snackbarExpire = null;
function showSnackbar(message, actionLabel, onAction, duration, onExpire) {
  const old = document.getElementById("fdx-snackbar");
  if (old) old.remove();
  if (snackbarTimer) { clearTimeout(snackbarTimer); snackbarTimer = null; }
  if (snackbarExpire) { const f = snackbarExpire; snackbarExpire = null; try { f(); } catch (e) {} }
  snackbarExpire = onExpire || null;
  const el = document.createElement("div");
  el.id = "fdx-snackbar";
  el.className = "fdx-snackbar";
  el.setAttribute("role", "status");
  el.innerHTML = `<span>${escapeHtml(message)}</span>${actionLabel ? `<button type="button">${escapeHtml(actionLabel)}</button>` : ""}`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  const hide = () => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); };
  if (actionLabel) el.querySelector("button").onclick = () => { snackbarExpire = null; hide(); if (snackbarTimer) clearTimeout(snackbarTimer); onAction(); };
  snackbarTimer = setTimeout(() => { hide(); const f = snackbarExpire; snackbarExpire = null; if (f) { try { f(); } catch (e) {} } }, duration || 5000);
}

function storageUsageKb() {
  let total = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("fdx_")) total += (k.length + (localStorage.getItem(k) || "").length) * 2;
    }
  } catch (e) {}
  return Math.round(total / 1024);

/* ---------- bouton retour Android : ferme d'abord les fenêtres au lieu de quitter l'app ---------- */
let backGuardActive = false;
let backExitArmed = false;
function armBackGuard() {
  if (backGuardActive) return;
  try { history.pushState({ fdx: "guard" }, ""); backGuardActive = true; } catch (e) {}
}
document.addEventListener("pointerdown", armBackGuard, true);
window.addEventListener("popstate", () => {
  backGuardActive = false;
  // fenêtres plein écran : on les ferme sans reconstruire l'écran (le formulaire ouvert garde sa saisie)
  if (document.getElementById("picker")) { closePicker(); backExitArmed = false; armBackGuard(); return; }
  if (document.getElementById("ident")) { closeIdentify(); backExitArmed = false; armBackGuard(); return; }
  let handled = true;
  if (state.sheet) state.sheet = null;
  else if (state.detailSpeciesId) state.detailSpeciesId = null;
  else if (state.showTargetAdvice) state.showTargetAdvice = false;
  else if (state.showSettings) state.showSettings = false;
  else if (state.showSessionSetup) { state.showSessionSetup = false; state.sessionSetupIsEdit = false; }
  else if (state.showForm) { state.showForm = false; state.editingId = null; state.photoData = ""; }
  else if (state.tab !== "accueil") state.tab = "accueil";
  else handled = false;
  if (handled) { backExitArmed = false; render(); window.scrollTo(0, 0); return; }
  if (!backExitArmed) {
    backExitArmed = true;
    showSnackbar("Appuie encore sur retour pour quitter", null, null, 2200);
    setTimeout(() => { backExitArmed = false; }, 2200);
  }
});

/* ---------- écran ACCUEIL ---------- */
function formatDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return [h, m, s].map((n) => String(n).padStart(2, "0")).join(":");
}
function formatDurationShort(minutes) {
  const h = Math.floor(minutes / 60);
  const m = Math.round(minutes % 60);
  if (h === 0) return `${m} min`;
  return `${h} h ${String(m).padStart(2, "0")} min`;
}

/* ---------- espèces mystères à débloquer ---------- */
function periodMonths(text) {
  const t = normalizeText(text || "");
  if (!t || t.includes("toute l")) return null; // toute l'année (ou inconnu) : pas de restriction
  const re = /\b(printemps|ete|automne|hiver|janv\w*|fev\w*|mars|avr\w*|mai|juin|juil\w*|aout|sept\w*|oct\w*|nov\w*|dec\w*)\b/g;
  const tokens = [];
  let m;
  while ((m = re.exec(t))) tokens.push({ w: m[1], i: m.index });
  if (!tokens.length) return null;
  const SEASON = { printemps: [3, 5], ete: [6, 8], automne: [9, 11], hiver: [12, 2] };
  const MONTHS = [["janv", 1], ["fev", 2], ["mars", 3], ["avr", 4], ["mai", 5], ["juin", 6], ["juil", 7], ["aout", 8], ["sept", 9], ["oct", 10], ["nov", 11], ["dec", 12]];
  const range = (w) => { if (SEASON[w]) return SEASON[w]; const f = MONTHS.find(([k]) => w.startsWith(k)); return f ? [f[1], f[1]] : null; };
  const a = range(tokens[0].w);
  if (!a) return null;
  let from = a[0], to = a[1];
  if (tokens.length >= 2 && /\ba\b/.test(t.slice(tokens[0].i, tokens[1].i))) {
    const b = range(tokens[1].w);
    if (b) to = t.slice(Math.max(0, tokens[1].i - 10), tokens[1].i).includes("debut") ? b[0] : b[1];
  }
  const months = new Set();
  let k = from;
  for (let n = 0; n < 12; n++) { months.add(k); if (k === to) break; k = (k % 12) + 1; }
  return months;
}
function suggestNextSpecies(n) {
  const disc = discoveredIds();
  const month = new Date().getMonth() + 1;
  const catCount = {};
  state.catches.forEach((c) => { const sp = speciesById(c.especeId); if (sp) catCount[sp.categorie] = (catCount[sp.categorie] || 0) + 1; });
  const myCats = Object.keys(catCount);
  const day = Math.floor(Date.now() / 86400000);
  const hash = (id) => { let h = day; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  return SPECIES.filter((sp) => {
    if (disc.has(sp.id)) return false;
    if (myCats.length && !myCats.includes(sp.categorie)) return false;
    const reg = normalizeText(sp.reglementation + " " + sp.periode);
    if (reg.includes("interdit") || reg.includes("protege")) return false;
    const months = periodMonths(sp.periode);
    return !months || months.has(month);
  }).sort((a, b) => (a.difficulte - b.difficulte) || ((catCount[b.categorie] || 0) - (catCount[a.categorie] || 0)) || (hash(a.id) - hash(b.id))).slice(0, n);
}

function pageFileName() {

}
function isCanonicalPage() { const f = pageFileName(); return f === "" || f === "index.html"; }
function isHostedSite() { return /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); }

function checkPageAddress() {

// Les anciennes adresses (ex. « index (3).html ») gardées en cache renvoient désormais vers index.html
async function redirectOldCachedPages() {

    if (found.length === 0) return `<div class="empty-hint">Aucune prise ne correspond à « ${escapeHtml(state.journalSearch)} ».</div>`;
    return `<div style="font-size:12px; color:var(--muted); margin-bottom:10px;">${found.length} résultat${found.length > 1 ? "s" : ""}</div>` + found.map((c) => renderCatchCard(c)).join("");
  }

}
function buildJournalGroups() {
  const bySession = {};
  const standalone = [];
  state.catches.forEach((c) => {
    if (c.sessionId) { (bySession[c.sessionId] = bySession[c.sessionId] || []).push(c); }
    else { standalone.push(c); }
  });
  const items = [];
  const handledSessionIds = new Set();
  Object.entries(bySession).forEach(([sid, catches]) => {
    const saved = state.sessions.find((s) => s.id === sid);
    const active = !!(state.activeSession && state.activeSession.id === sid);
    const startTs = saved ? saved.startTs : active ? state.activeSession.startTs : parseInt(sid, 10) || 0;
    items.push({
      type: "session",
      sortTs: startTs,
      meta: { id: sid, startTs, lieu: saved ? saved.lieu : (active ? state.activeSession.lieu : ""), dureeMinutes: saved ? saved.dureeMinutes : null, active },
      catches: catches.slice().sort((a, b) => (parseInt(b.id, 10) || 0) - (parseInt(a.id, 10) || 0)),
    });
    handledSessionIds.add(sid);
  });
  // Sorties terminées sans aucune prise : on les affiche quand même (vides), pour pouvoir les supprimer
  state.sessions.forEach((s) => {
    if (handledSessionIds.has(s.id)) return;
    items.push({
      type: "session",
      sortTs: s.startTs,
      meta: { id: s.id, startTs: s.startTs, lieu: s.lieu, dureeMinutes: s.dureeMinutes, active: false },
      catches: [],
    });
  });
  standalone.forEach((c) => items.push({ type: "single", sortTs: parseInt(c.id, 10) || 0, catch: c }));
  items.sort((a, b) => b.sortTs - a.sortTs);
  return items;
}

      </div>`;
}

function renderHourChart() {
  const byHour = new Array(24).fill(0);
  let n = 0;
  state.catches.forEach((c) => {
    if (!c.heure) return;
    const h = parseInt(String(c.heure).split(":")[0], 10);
    if (isNaN(h) || h < 0 || h > 23) return;
    const q = parseInt(c.quantite, 10);
    byHour[h] += q > 0 ? q : 1;
    n++;
  });
  if (n < 3) return "";
  const max = Math.max(...byHour);
  const best = byHour.indexOf(max);
  const bars = byHour.map((v, h) => `
    <div class="bar-col"><div class="bar" style="height:${Math.max((v / max) * 100, v > 0 ? 4 : 0)}%;${h === best ? "" : " opacity:0.7;"}" title="${h}h : ${v}"></div><div class="bar-label">${h % 3 === 0 ? h + "h" : ""}</div></div>`).join("");
  return `
    <div class="section-title">🕐 Heures de tes prises</div>
    <div class="card"><div class="bar-chart" style="gap:2px; height:110px;">${bars}</div>
      <div style="font-size:12px; color:var(--muted); margin-top:8px;">Ton créneau le plus productif : <b style="color:var(--accent);">${best}h–${(best + 1) % 24}h</b> (${max} prise${max > 1 ? "s" : ""})</div>
    </div>`;
}
function renderStatsExtras() {
  let html = "";
  // Efficacité des sorties chronométrées
  const finished = state.sessions.filter((x) => x.dureeMinutes > 0);
  const finishedIds = new Set(finished.map((x) => x.id));
  const inFinished = state.catches.filter((c) => c.sessionId && finishedIds.has(c.sessionId));
  const hours = finished.reduce((sum, x) => sum + x.dureeMinutes, 0) / 60;
  const released = state.catches.filter((c) => c.relachee).length;
  const fishCount = state.catches.filter((c) => { const sp = speciesById(c.especeId); return !sp || !HAND_GATHERED_CATEGORIES.includes(sp.categorie); }).length;
  const tiles = [];
  if (hours >= 0.5 && inFinished.length > 0) tiles.push(`<div class="card mini-stat"><div class="icon">⚡</div><div class="value">${(inFinished.length / hours).toFixed(1).replace(".", ",")}</div><div class="label">Prises / heure en sortie</div></div>`);
  if (fishCount > 0) tiles.push(`<div class="card mini-stat"><div class="icon">♻️</div><div class="value">${Math.round((released / fishCount) * 100)} %</div><div class="label">Remis à l'eau (${released})</div></div>`);
  if (tiles.length) html += `<div class="section-title">🎯 Efficacité</div><div class="stats-grid" style="grid-template-columns:${tiles.length > 1 ? "1fr 1fr" : "1fr"};">${tiles.join("")}</div>`;
  const best = finished.map((x) => ({ x, n: state.catches.filter((c) => c.sessionId === x.id).length })).sort((a, b) => b.n - a.n)[0];
  if (best && best.n > 1) {
    html += `<div class="card" style="margin-top:10px; font-size:13px;">🏅 Meilleure sortie : <b>${best.n} prises</b> le ${formatDate(localDateStr(new Date(best.x.startTs)))}${best.x.lieu ? " à " + escapeHtml(best.x.lieu) : ""} (${formatDurationShort(best.x.dureeMinutes)})</div>`;
  }
  // Records personnels par espèce
  const rec = {};
  state.catches.forEach((c) => {
    const r = rec[c.especeId] || (rec[c.especeId] = { n: 0, t: 0, p: 0 });
    const q = parseInt(c.quantite, 10);
    r.n += q > 0 ? q : 1;
    const t = parseFloat(c.taille), p = parseFloat(c.poids);
    if (!isNaN(t) && t > r.t) r.t = t;
    if (!isNaN(p) && p > r.p) r.p = p;
  });
  const recList = Object.entries(rec).filter(([, r]) => r.t > 0 || r.p > 0).sort((a, b) => b[1].n - a[1].n).slice(0, 10);
  if (recList.length) {
    html += `<div class="section-title">🏅 Records personnels</div><div class="card" style="padding:6px 14px;">
      ${recList.map(([id, r], i) => `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; ${i > 0 ? "border-top:1px solid var(--border);" : ""}">
          <span style="font-size:13.5px;">${escapeHtml(speciesName(id))} <span style="color:var(--muted); font-size:11.5px;">×${r.n}</span></span>
          <span class="mono" style="font-size:12.5px; color:var(--accent); text-align:right;">${r.t > 0 ? r.t + " cm" : ""}${r.t > 0 && r.p > 0 ? " · " : ""}${r.p > 0 ? String(r.p).replace(".", ",") + " kg" : ""}</span>
        </div>`).join("")}
    </div>`;
  }
  // Test perso de la théorie solunaire
  const pos = getSolunarPosition();
  const timed = state.catches.filter((c) => c.date && c.heure);
  if (timed.length >= 5) {
    let major = 0, minor = 0;
    timed.forEach((c) => { const r = catchInSolunarPeriod(c, pos); if (r === "majeure") major++; else if (r === "mineure") minor++; });
    const pct = Math.round(((major + minor) / timed.length) * 100);
    const verdict = pct >= 35 ? "Tes prises semblent suivre la lune 🌙" : pct <= 15 ? "La lune ne semble pas jouer pour toi" : "Pas d'effet net pour l'instant";
    html += `<div class="section-title">🌙 Tes prises et la lune</div>
      <div class="card" style="font-size:13px; line-height:1.55;">
        <b style="color:var(--accent);">${pct} %</b> de tes prises (${major + minor} sur ${timed.length}) ont eu lieu pendant une période solunaire
        (${major} majeure${major > 1 ? "s" : ""}, ${minor} mineure${minor > 1 ? "s" : ""}), alors que ces périodes ne couvrent qu'environ <b>25 %</b> de la journée.
        <div style="margin-top:6px; color:var(--muted); font-size:12px;">${verdict}${timed.length < 20 ? " (à confirmer avec plus de prises)" : ""}.</div>
      </div>`;
  }
  return html;
}

/* ---------- écran SUCCÈS ---------- */
function renderSucces() {
  const unlocked = new Set(unlockedAchievements().map((a) => a.id));
  const sorted = ACHIEVEMENTS.slice().sort((a, b) => (unlocked.has(b.id) ? 1 : 0) - (unlocked.has(a.id) ? 1 : 0));
  return `
    <div class="section-title">🏆 ${unlocked.size} / ${ACHIEVEMENTS.length} succès débloqués</div>
    ${sorted.map((a) => {
      const done = unlocked.has(a.id);
      return `
        <div class="card ach-item" style="border-color:${done ? "var(--accent)" : "var(--border)"}; opacity:${done ? 1 : 0.6};">
          <span class="check">${done ? "✅" : "🔒"}</span>
          <div><div class="txt-title">${escapeHtml(a.label)}</div><div class="txt-desc">${escapeHtml(a.desc)}</div></div>
        </div>`;
    }).join("")}
  `;
}

/* ---------- écran CARTE ---------- */
function renderCalendrier() {
  const year = state.calendarYear, month = state.calendarMonth;
  const firstDay = new Date(year, month, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = localDateStr(new Date());

  const catchesByDate = {};
  state.catches.forEach((c) => { if (c.date) (catchesByDate[c.date] = catchesByDate[c.date] || []).push(c); });
  const sessionsByDate = {};
  state.sessions.forEach((s) => { const d = localDateStr(new Date(s.startTs)); (sessionsByDate[d] = sessionsByDate[d] || []).push(s); });
  if (state.activeSession) { const d = localDateStr(new Date(state.activeSession.startTs)); (sessionsByDate[d] = sessionsByDate[d] || []).push(state.activeSession); }

  const solPos = getSolunarPosition();
  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<button class="cal-day empty" disabled></button>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const phase = getMoonPhase(new Date(year, month, day, 12));
    const emoji = moonPhaseEmoji(phase);
    const hasActivity = !!catchesByDate[dateStr] || !!sessionsByDate[dateStr];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === state.calendarSelectedDate;
    const goodDay = solunarFor(dateStr, solPos.lat, solPos.lng).rating >= 3;
    cells += `
      <button class="cal-day ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}" data-cal-date="${dateStr}" aria-label="${formatDate(dateStr)}${hasActivity ? ", activité enregistrée" : ""}">
        ${goodDay ? `<span class="cal-star" aria-hidden="true">★</span>` : ""}
        <span class="cal-moon">${emoji}</span>
        <span>${day}</span>
        ${hasActivity ? `<span class="cal-dot"></span>` : ""}
      </button>`;
  }

  const selected = state.calendarSelectedDate;
  let detailHtml = "";
  if (selected) {
    const [sy, sm, sd] = selected.split("-").map(Number);
    const phase = getMoonPhase(new Date(sy, sm - 1, sd, 12));
    const selSol = solunarFor(selected, solPos.lat, solPos.lng);
    const catches = catchesByDate[selected] || [];
    const sessions = sessionsByDate[selected] || [];
    detailHtml = `
      <div class="cal-detail card">
        <div class="oswald" style="font-size:16px;">${formatDate(selected)}</div>
        <div style="font-size:13px; color:var(--muted); margin-top:4px;">${moonPhaseEmoji(phase)} ${moonPhaseLabel(phase)} · ${Math.round(selSol.illumination * 100)} % éclairée</div>
        <div style="font-size:12.5px; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span>☀️ ${selSol.sun.rise ? formatHM(selSol.sun.rise) : "–"} → ${selSol.sun.set ? formatHM(selSol.sun.set) : "–"}</span>
          <span>${ratingDots(selSol.rating)} ${RATING_LABELS[selSol.rating]}</span>
        </div>
        ${(() => {
          const fc = forecastForPosition(solPos);
          const w = fc && fc.daily[selected];
          return w && w.tmax !== null ? `<div style="font-size:12.5px; color:var(--muted); margin-top:4px;">${weatherEmoji(w.code)} Prévu : ${w.tmin !== null ? Math.round(w.tmin) + "–" : ""}${Math.round(w.tmax)}°C${w.wind !== null ? ` · vent jusqu'à ${Math.round(w.wind)} km/h${w.dir !== null ? " " + windDirFr(w.dir) : ""}` : ""}</div>` : "";
        })()}
        ${solunarTimeline(selSol, new Date(sy, sm - 1, sd).getTime(), selected === todayStr)}
        ${solunarPeriodsList(selSol)}
        ${sessions.length ? `<div style="font-size:12.5px; color:var(--accent); margin-top:8px;">🎣 ${sessions.length} sortie${sessions.length > 1 ? "s" : ""} ce jour-là</div>` : ""}
        ${catches.length ? `
          <div class="section-title" style="margin-top:12px;">🐟 ${catches.length} prise${catches.length > 1 ? "s" : ""}</div>
          ${catches.map((c) => `<div style="font-size:12.5px; color:var(--text); margin-bottom:4px;">${escapeHtml(speciesName(c.especeId))}${c.taille ? " · " + escapeHtml(c.taille) + "cm" : ""}${c.poids ? " · " + escapeHtml(c.poids) + "kg" : ""}</div>`).join("")}
        ` : `<div style="font-size:12.5px; color:var(--muted); margin-top:8px;">Aucune prise enregistrée ce jour-là.</div>`}
      </div>`;
  }

  return `
    <div class="cal-header">
      <button class="cal-nav-btn" id="cal-prev" aria-label="Mois précédent">‹</button>
      <div class="oswald" style="font-size:17px;">${MONTH_NAMES_FULL[month]} ${year}</div>
      <button class="cal-nav-btn" id="cal-next" aria-label="Mois suivant">›</button>
    </div>
    <div class="cal-grid">
      ${WEEKDAY_LABELS.map((w) => `<div class="cal-weekday">${w}</div>`).join("")}
      ${cells}
    </div>
    ${detailHtml}
    <div style="font-size:11px; color:var(--muted); margin-top:14px; line-height:1.5;">
      🌑🌒🌓🌔🌕🌖🌗🌘 Phases lunaires et heures du soleil calculées hors ligne. Le point orange indique une prise ou une sortie ce jour-là, l'étoile ★ une journée favorable.<br>
      Périodes solunaires : <b>majeures</b> (lune au zénith ou au nadir, 2 h) et <b>mineures</b> (lever et coucher de lune, 1 h), calculées pour : ${escapeHtml(solPos.label)}. Théorie indicative, à confronter à tes propres stats.
    </div>
  `;
}

let fdxLeafletMap = null;
function loadLeaflet(onReady, onError) {
  if (window.L) { onReady(); return; }
  if (!document.getElementById("leaflet-css")) {
    const link = document.createElement("link");
    link.id = "leaflet-css"; link.rel = "stylesheet";
    link.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(link);
  }
  const script = document.createElement("script");
  script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  script.onload = onReady;
  script.onerror = onError;
  document.head.appendChild(script);
}

          <div class="btn-row"><button class="small-btn" id="set-weather-toggle">${weatherEnabled() ? "Désactiver la météo" : "☁️ Activer la météo"}</button></div>

        <div class="card" style="font-size:13px; color:var(--muted); line-height:1.6;">
          <div style="color:var(--text); font-family:'Oswald',sans-serif; font-size:15px; margin-bottom:4px;">HookDex France</div>
          ${total} espèces au catalogue · ${disc} découverte${disc > 1 ? "s" : ""} · ${state.catches.length} prise${state.catches.length > 1 ? "s" : ""} enregistrée${state.catches.length > 1 ? "s" : ""}<br>
          Toutes tes données restent stockées uniquement sur cet appareil. Seuls la météo et la mer (Open-Meteo), le nom des communes (geo.api.gouv.fr) et la carte (OpenStreetMap, IGN) contactent internet, uniquement quand tu les utilises.<br>
          <div id="app-status" style="margin:8px 0; font-size:12.5px;"></div>
          <a href="politique-confidentialite.html" style="color:var(--accent);">Politique de confidentialité</a>

}

function attachSettingsHandlers() {
  const overlay = document.getElementById("settings-overlay");
  const close = () => { state.showSettings = false; render(); };
  if (overlay) overlay.onclick = (e) => { if (e.target === overlay) close(); };
  const closeBtn = document.getElementById("settings-close");
  if (closeBtn) closeBtn.onclick = close;
  const darkBtn = document.getElementById("set-theme-dark");
  if (darkBtn) darkBtn.onclick = () => { state.theme = "dark"; saveTheme("dark"); render(); };
  const lightBtn = document.getElementById("set-theme-light");
  if (lightBtn) lightBtn.onclick = () => { state.theme = "light"; saveTheme("light"); render(); };
  const autoBtn = document.getElementById("set-theme-auto");
  if (autoBtn) autoBtn.onclick = () => { state.theme = "auto"; saveTheme("auto"); render(); };
  const exportBtn = document.getElementById("set-export");
  if (exportBtn) exportBtn.onclick = exportData;
  const exportCsvBtnSettings = document.getElementById("set-export-csv");
  if (exportCsvBtnSettings) exportCsvBtnSettings.onclick = exportDataCsv;
  const importInput = document.getElementById("set-import");
  if (importInput) importInput.onchange = importData;
  const shareBackupBtn = document.getElementById("set-share-backup");
  if (shareBackupBtn) shareBackupBtn.onclick = shareBackup;
  const solHere = document.getElementById("set-solunar-here");
  if (solHere) solHere.onclick = () => { state.showSettings = false; render(); useGpsAsPlace(); };
  const setPicker = document.getElementById("set-open-picker");
  if (setPicker) setPicker.onclick = () => { state.showSettings = false; render(); openPicker("place"); };
  const placeClear = document.getElementById("set-place-clear");
  if (placeClear) placeClear.onclick = () => { localStorage.removeItem("fdx_place"); localStorage.removeItem("fdx_solunar_pos"); localStorage.removeItem("fdx_marine"); render(); };
  const solAuto = document.getElementById("set-solunar-auto");
  if (solAuto) solAuto.onclick = () => { localStorage.removeItem("fdx_solunar_pos"); render(); };
  updateStorageCard();
  updateAppStatus();
  const forceUpdate = document.getElementById("set-force-update");
  if (forceUpdate) forceUpdate.onclick = async () => {
    forceUpdate.textContent = "Recherche de la dernière version…";
    const changed = await refreshAppCache(true);
    forceUpdate.textContent = "🔄 Forcer la mise à jour de l'app";
    if (changed) showSnackbar("Nouvelle version trouvée", "Recharger", applyUpdate, 10000);
    else showSnackbar(`Tu as déjà la dernière version publiée (${APP_VERSION})`);
  };
  const weatherToggle = document.getElementById("set-weather-toggle");
  if (weatherToggle) weatherToggle.onclick = () => {
    if (weatherEnabled()) { localStorage.removeItem("fdx_weather_home"); localStorage.removeItem("fdx_forecast"); localStorage.removeItem("fdx_marine"); localStorage.setItem("fdx_weather_off", "1"); }
    else { localStorage.setItem("fdx_weather_home", "1"); localStorage.removeItem("fdx_weather_off"); refreshForecast(true); refreshMarine(true); }
    render();
  };
  const clearBtn = document.getElementById("set-clear");
  if (clearBtn) clearBtn.onclick = () => {
    if (confirm(`Effacer définitivement tes ${state.catches.length} prise(s) enregistrée(s) et leurs photos ? Cette action est irréversible. Pense à télécharger une sauvegarde avant.`)) {
      state.catches = [];
      saveCatches(state.catches);
      PhotoDB.clear().catch(() => {});
      photoCache.clear();
      render();
      checkNewAchievements();
    }
  };
}

function renderModal() {
  if (!state.detailSpeciesId) return "";
  const s = speciesById(state.detailSpeciesId);
  if (!s) return "";
  const meta = catMeta(s.categorie);
  const caught = discoveredIds().has(s.id);
  const myCatches = state.catches.filter((c) => c.especeId === s.id);
  return `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
          <div>
            <span style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;">${meta.emoji} ${meta.label}</span>
            <h2 class="oswald" style="font-size:24px; margin:4px 0 0;">${caught ? escapeHtml(s.nom) : "Espèce non découverte"}</h2>
            ${caught ? `<span style="font-size:12.5px; font-style:italic; color:var(--muted);">${escapeHtml(s.latin)}</span>` : ""}
            ${caught ? (() => { const r = categorizeRegulation(s.reglementation); return `<div style="margin-top:6px;"><span style="font-size:11px; font-weight:600; color:${r.color}; background:${r.color}22; padding:3px 8px; border-radius:12px;">${r.emoji} ${r.label}</span></div>`; })() : ""}
          </div>
          <button class="icon-btn-flat" id="modal-close" aria-label="Fermer la fiche" style="font-size:20px;">✕</button>
        </div>
        ${!caught ? `
          <p style="font-size:13.5px; color:var(--muted); line-height:1.6;">
            Capture cette espèce et enregistre-la dans ton journal pour débloquer sa fiche complète : habitat, tailles record, appâts conseillés et plus.
          </p>
          <div class="lock-hint">
            <div style="font-size:12px; color:var(--accent); margin-bottom:8px;">🔍 Indices pour la trouver</div>
            <div class="k">Habitat</div><div class="v">${escapeHtml(s.habitat)}</div>
            <div class="k" style="margin-top:8px;">Période</div><div class="v">${escapeHtml(s.periode)}</div>
            <div class="k" style="margin-top:8px;">Difficulté</div><div class="v mono">${"★".repeat(s.difficulte)}${"☆".repeat(5 - s.difficulte)}</div>
          </div>` : `
          <p style="font-size:13.5px; line-height:1.6; margin-bottom:14px;">${escapeHtml(s.description)}</p>
          <div class="modal-grid">
            <div class="modal-stat"><div class="k">Taille moy./max</div><div class="v">${escapeHtml(s.tailleMoy)} / ${escapeHtml(s.tailleMax)}</div></div>
            <div class="modal-stat"><div class="k">Poids moy./max</div><div class="v">${escapeHtml(s.poidsMoy)} / ${escapeHtml(s.poidsMax)}</div></div>
            <div class="modal-stat"><div class="k">Famille</div><div class="v">${escapeHtml(s.famille)}</div></div>
            <div class="modal-stat"><div class="k">Difficulté</div><div class="v">${"★".repeat(s.difficulte)}${"☆".repeat(5 - s.difficulte)}</div></div>
          </div>
          <div class="modal-row"><div class="k">Habitat</div><div class="v">${escapeHtml(s.habitat)}</div></div>
          <div class="modal-row"><div class="k">Répartition</div><div class="v">${escapeHtml(s.repartition)}</div></div>
          <div class="modal-row"><div class="k">Période de pêche</div><div class="v">${escapeHtml(s.periode)}</div></div>
          <div class="modal-row"><div class="k">Réglementation (résumé)</div><div class="v">${(() => { const r = categorizeRegulation(s.reglementation); return `<span style="color:${r.color}; font-weight:600;">${r.emoji} ${r.label}</span><br>${escapeHtml(s.reglementation)}`; })()}</div></div>
          ${renderSpeciesRegBlock(s)}
          ${s.appats.length ? `<div class="modal-row"><div class="k">Appâts conseillés</div><div class="v">${escapeHtml(s.appats.join(", "))}</div></div>` : ""}
          ${s.leurres.length ? `<div class="modal-row"><div class="k">Leurres conseillés</div><div class="v">${escapeHtml(s.leurres.join(", "))}</div></div>` : ""}
          ${(() => {
            const bestTaille = myCatches.reduce((max, c) => { const t = parseFloat(c.taille); return !isNaN(t) && t > max ? t : max; }, 0);
            const bestPoids = myCatches.reduce((max, c) => { const p = parseFloat(c.poids); return !isNaN(p) && p > max ? p : max; }, 0);
            if (bestTaille === 0 && bestPoids === 0) return "";
            return `
            <div class="section-title">🏅 Ton record personnel</div>
            <div class="card" style="display:flex; gap:20px;">
              ${bestTaille > 0 ? `<div class="modal-stat"><div class="k">Taille</div><div class="v" style="color:var(--accent); font-size:16px;">${bestTaille}cm</div></div>` : ""}
              ${bestPoids > 0 ? `<div class="modal-stat"><div class="k">Poids</div><div class="v" style="color:var(--accent); font-size:16px;">${bestPoids}kg</div></div>` : ""}
            </div>`;
          })()}
          ${myCatches.length ? `
            <div class="section-title">🐟 Tes prises (${myCatches.length})</div>
            ${myCatches.slice(0,5).map((c) => `<button class="icon-btn-flat" data-edit-from-modal="${c.id}" style="display:block; width:100%; text-align:left; font-size:12.5px; color:var(--muted); margin-bottom:4px; padding:6px 8px; border-radius:6px;">✏️ ${formatDate(c.date)}${c.taille ? " · " + escapeHtml(c.taille) + "cm" : ""}${c.poids ? " · " + escapeHtml(c.poids) + "kg" : ""}${c.quantite ? " · ×" + escapeHtml(c.quantite) : ""}</button>`).join("")}
          ` : ""}
        `}
        <button class="primary-btn" id="modal-add-catch" data-species="${s.id}" style="margin-top:18px;">➕ ${caught ? "Nouvelle prise de cette espèce" : "J'en ai pris un !"}</button>
      </div>
    </div>
  `;
}

/* ---------- handlers ---------- */
function attachMainHandlers() {
  // Calendrier
  const calPrev = document.getElementById("cal-prev");
  if (calPrev) calPrev.onclick = () => {
    state.calendarMonth--; if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
    state.calendarSelectedDate = null;
    renderMain();
  };
  const calNext = document.getElementById("cal-next");
  if (calNext) calNext.onclick = () => {
    state.calendarMonth++; if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
    state.calendarSelectedDate = null;
    renderMain();
  };
  document.querySelectorAll("[data-cal-date]").forEach((btn) => {
    btn.onclick = () => { state.calendarSelectedDate = btn.dataset.calDate; renderMain(); };
  });
  // Accueil
  const btnAdd = document.getElementById("btn-add-catch");
  if (btnAdd) btnAdd.onclick = () => openNewCatchForm();
  const btnSessionAdd = document.getElementById("btn-session-add-catch");
  if (btnSessionAdd) btnSessionAdd.onclick = () => openNewCatchForm();
  document.querySelectorAll("[data-quick-species]").forEach((chip) => {
    chip.onclick = () => openNewCatchForm({ especeId: chip.dataset.quickSpecies });
  });
  const btnSolPos = document.getElementById("btn-solunar-pos");
  if (btnSolPos) btnSolPos.onclick = () => setSolunarPositionFromGps(() => renderMain());
  const backupDl = document.getElementById("btn-backup-download");
  if (backupDl) backupDl.onclick = exportData;
  const backupShare = document.getElementById("btn-backup-share");
  if (backupShare) backupShare.onclick = shareBackup;
  document.querySelectorAll("[data-goto-day]").forEach((b) => {
    b.onclick = () => {
      const [y, m] = b.dataset.gotoDay.split("-").map(Number);
      state.calendarYear = y; state.calendarMonth = m - 1; state.calendarSelectedDate = b.dataset.gotoDay;
      state.tab = "calendrier";
      render();
      window.scrollTo(0, 0);
    };
  });
  document.querySelectorAll("[data-open-species]").forEach((b) => {
    b.onclick = () => { state.detailSpeciesId = b.dataset.openSpecies; render(); };
  });
  const enableWeather = document.getElementById("btn-enable-weather");
  if (enableWeather) enableWeather.onclick = () => {
    localStorage.setItem("fdx_weather_home", "1");
    showSnackbar("Météo activée : chargement…", null, null, 2500);
    refreshForecast(true);
    refreshMarine(true);
    localStorage.removeItem("fdx_weather_off");
    renderMain();
  };
  const goCanonical = document.getElementById("btn-go-canonical");
  if (goCanonical) goCanonical.onclick = () => { location.href = "./index.html"; };
  if (state.tab === "accueil") refreshForecast(false);
  const backupLater = document.getElementById("btn-backup-later");
  if (backupLater) backupLater.onclick = () => { localStorage.setItem("fdx_backup_snooze", String(Date.now() + 7 * 86400000)); renderMain(); };
  const btnGoDex = document.getElementById("btn-go-dex");
  if (btnGoDex) btnGoDex.onclick = () => { state.tab = "dex"; render(); };
  const lastCard = document.getElementById("last-catch-card");
  if (lastCard) lastCard.onclick = () => { const lc = latestCatch(); const sp = lc && speciesById(lc.especeId); if (sp) { state.detailSpeciesId = sp.id; render(); } };
  const dismissInstall = document.getElementById("dismiss-install");
  if (dismissInstall) dismissInstall.onclick = () => { localStorage.setItem("fdx_install_hint_dismissed", "1"); document.getElementById("install-banner").classList.remove("show"); };
  const btnStartSession = document.getElementById("btn-start-session");
  if (btnStartSession) btnStartSession.onclick = () => {
    state.showSessionSetup = true;
    state.sessionSetupIsEdit = false;
    state.sessionSetupTargets = [];
    state.sessionSetupSearch = "";
    renderMain();
  };
  const btnEditSession = document.getElementById("btn-edit-session");
  if (btnEditSession) btnEditSession.onclick = () => {
    state.showSessionSetup = true;
    state.sessionSetupIsEdit = true;
    state.sessionSetupTargets = [...(state.activeSession.targetSpecies || [])];
    state.sessionSetupSearch = "";
    renderMain();
  };
  const sessionSetupCancel = document.getElementById("session-setup-cancel");
  if (sessionSetupCancel) sessionSetupCancel.onclick = () => { state.showSessionSetup = false; state.sessionSetupIsEdit = false; renderMain(); };
  document.querySelectorAll("[data-recent-lieu]").forEach((chip) => {
    chip.onclick = () => {
      const lieuEl = document.getElementById("session-lieu");
      const latEl = document.getElementById("session-lat");
      const lngEl = document.getElementById("session-lng");
      if (lieuEl) lieuEl.value = chip.dataset.recentLieu;
      if (latEl && chip.dataset.recentLat) latEl.value = chip.dataset.recentLat;
      if (lngEl && chip.dataset.recentLng) lngEl.value = chip.dataset.recentLng;
    };
  });
  const sessionGpsBtn = document.getElementById("session-gps-btn");
  if (sessionGpsBtn) sessionGpsBtn.onclick = () => {
    const statusEl = document.getElementById("session-gps-status");
    if (!navigator.geolocation) { if (statusEl) statusEl.textContent = "Géolocalisation non disponible."; return; }
    if (statusEl) statusEl.textContent = "Localisation en cours…";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById("session-lat").value = pos.coords.latitude.toFixed(5);
        document.getElementById("session-lng").value = pos.coords.longitude.toFixed(5);
        if (statusEl) statusEl.textContent = "Position enregistrée ✓";
      },
      () => { if (statusEl) statusEl.textContent = "Impossible de récupérer la position automatiquement."; },
      { timeout: 8000 }
    );
  };
  const sessionTargetSearch = document.getElementById("session-target-search");
  if (sessionTargetSearch) sessionTargetSearch.oninput = (e) => {
    state.sessionSetupSearch = e.target.value;
    const listEl = document.getElementById("session-target-list");
    if (listEl) listEl.innerHTML = renderSessionTargetOptions();
    attachSessionTargetCheckboxHandlers();
  };
  attachSessionTargetCheckboxHandlers();
  const sessionSetupConfirm = document.getElementById("session-setup-confirm");
  if (sessionSetupConfirm) sessionSetupConfirm.onclick = () => {
    const lieu = (document.getElementById("session-lieu").value || "").trim();
    const lat = document.getElementById("session-lat").value;
    const lng = document.getElementById("session-lng").value;
    if (state.sessionSetupIsEdit && state.activeSession) {
      state.activeSession = { ...state.activeSession, lieu, lat, lng, targetSpecies: [...state.sessionSetupTargets] };
      saveActiveSession(state.activeSession);
    } else {
      state.activeSession = { id: Date.now().toString(), startTs: Date.now(), lieu, lat, lng, targetSpecies: [...state.sessionSetupTargets] };
      saveActiveSession(state.activeSession);
      startSessionTimerLoop();
    }
    state.showSessionSetup = false;
    state.sessionSetupIsEdit = false;
    state.sessionSetupTargets = [];
    state.sessionSetupSearch = "";
    renderMain();
  };
  const btnShowTargets = document.getElementById("btn-show-targets");
  if (btnShowTargets) btnShowTargets.onclick = () => { state.showTargetAdvice = true; render(); };
  const btnEndSession = document.getElementById("btn-end-session");
  if (btnEndSession) btnEndSession.onclick = () => {
    if (!confirm(`Terminer la sortie (${formatDuration(Date.now() - state.activeSession.startTs)}) ?`)) return;
    const endTs = Date.now();
    const dureeMinutes = Math.max(1, Math.round((endTs - state.activeSession.startTs) / 60000));
    const nbPrises = state.catches.filter((c) => c.sessionId === state.activeSession.id).length;
    state.sessions = [{ ...state.activeSession, endTs, dureeMinutes, nbPrises }, ...state.sessions];
    saveSessions(state.sessions);
    state.activeSession = null;
    saveActiveSession(null);
    if (sessionTimerInterval) { clearInterval(sessionTimerInterval); sessionTimerInterval = null; }
    render();
    checkNewAchievements();
    showSnackbar(`Sortie terminée : ${nbPrises} prise${nbPrises > 1 ? "s" : ""} en ${formatDurationShort(dureeMinutes)} ✓`);
  };
  if (state.activeSession && !sessionTimerInterval) startSessionTimerLoop();

  // Dex
  const dexSearch = document.getElementById("dex-search");
  if (dexSearch) {
    dexSearch.oninput = (e) => { state.search = e.target.value; document.getElementById("dex-grid").innerHTML = renderDexGridInner(); attachDexGridHandlers(); refreshSearchClear(); };
    if (state.dexSearchFocused) {
      dexSearch.focus();
      dexSearch.selectionStart = dexSearch.selectionEnd = dexSearch.value.length;
    }
    dexSearch.onfocus = () => { state.dexSearchFocused = true; };
    dexSearch.onblur = () => { state.dexSearchFocused = false; };
  }
  refreshSearchClear();
  document.querySelectorAll("#dex-status button").forEach((b) => {
    b.onclick = () => { state.dexStatus = b.dataset.status; renderMain(); };
  });
  document.querySelectorAll("#dex-chips .chip").forEach((chip) => {
    chip.onclick = () => { state.dexFilter = chip.dataset.cat; renderMain(); };
  });
  attachDexGridHandlers();

  // Journal
  const journalSearch = document.getElementById("journal-search");
  if (journalSearch) journalSearch.oninput = (e) => {
    state.journalSearch = e.target.value;
    const list = document.getElementById("catch-list");
    if (list) list.innerHTML = renderCatchList();
    attachMainHandlers();
  };
  const journalSearchClear = document.getElementById("journal-search-clear");
  if (journalSearchClear) journalSearchClear.onclick = () => { state.journalSearch = ""; renderMain(); };
  const btnNewCatch = document.getElementById("btn-new-catch");
  if (btnNewCatch) btnNewCatch.onclick = () => openNewCatchForm();
  document.querySelectorAll("[data-pick-species]").forEach((chip) => {
    chip.onclick = () => {
      const sel = document.getElementById("f-espece");
      if (!sel) return;
      sel.value = chip.dataset.pickSpecies;
      updateFormFieldsVisibility(sel.value);
      document.querySelectorAll("[data-pick-species]").forEach((c) => c.classList.toggle("active", c === chip));
    };
  });
  const btnWeather = document.getElementById("btn-weather");
  if (btnWeather) btnWeather.onclick = fillWeather;
  const tailleInput = document.getElementById("f-taille");
  if (tailleInput) tailleInput.oninput = updateRegHint;
  const relacheeInput = document.getElementById("f-relachee");
  if (relacheeInput) relacheeInput.onchange = updateRegHint;
  document.querySelectorAll("[data-share]").forEach((btn) => { btn.onclick = () => shareCatchCard(btn.dataset.share); });
  const closeForm = document.getElementById("close-form");
  if (closeForm) closeForm.onclick = () => { state.showForm = false; state.editingId = null; state.photoData = ""; state.photoDirty = false; renderMain(); };
  const btnGps = document.getElementById("btn-gps");

function filterEspeceOptions(query) {

  const q = normalizeText(query.trim());
  Array.from(select.querySelectorAll("optgroup")).forEach((group) => {
    let anyVisible = false;
    Array.from(group.querySelectorAll("option")).forEach((opt) => {

  });

function handlePhotoInput(e) {

  if (errEl) errEl.textContent = "Compression de la photo…";
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxDim = photoDbReady ? 1600 : 1080;
      let width = img.width, height = img.height;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      const compressed = canvas.toDataURL("image/jpeg", photoDbReady ? 0.8 : 0.68);
      state.photoData = compressed;
      state.photoDirty = true;
      const preview = document.getElementById("photo-preview");
      if (preview) preview.innerHTML = photoPreviewHtml(compressed);
      attachPhotoRemove();
      if (errEl) errEl.textContent = "";
    };
    img.onerror = () => { if (errEl) errEl.textContent = "Impossible de lire cette image."; };
    img.src = reader.result;
  };

async function submitCatch() {
  if (state.submitting) return;
  const especeId = document.getElementById("f-espece").value;
  const date = document.getElementById("f-date").value;
  if (!especeId || !date) { document.getElementById("form-error").textContent = "Choisis une espèce et une date au minimum."; return; }
  const v = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
  const fields = {
    especeId, date,
    heure: v("f-heure"), taille: v("f-taille"), poids: v("f-poids"), quantite: v("f-quantite"),
    profondeur: v("f-profondeur"), tempEau: v("f-tempEau"), meteo: v("f-meteo"), vent: v("f-vent"), pression: v("f-pression"),
    appat: v("f-appat"), leurre: v("f-leurre"), technique: v("f-technique"), canne: v("f-canne"), moulinet: v("f-moulinet"),
    fil: v("f-fil"), basDeLigne: v("f-basDeLigne"), hameçon: v("f-hameçon"), remarques: v("f-remarques"),
    relachee: document.getElementById("f-relachee").checked,
    lat: v("f-lat"), lng: v("f-lng"),
  };
  const existing = state.editingId ? state.catches.find((c) => c.id === state.editingId) : null;
  const id = existing ? existing.id : Date.now().toString();
  const btn = document.getElementById("btn-submit-catch");
  state.submitting = true;
  if (btn) btn.disabled = true;
  try {
    // Photo : rangée à part (IndexedDB) AVANT d'enregistrer la prise ; sinon, repli sur l'ancien stockage
    let photoFields = null; // null = photo inchangée
    let removePhoto = false;
    if (!existing || state.photoDirty) {
      if (state.photoData) {
        let stored = false;
        try { await PhotoDB.put(id, state.photoData); stored = (await PhotoDB.get(id)) === state.photoData; } catch (e) { stored = false; }
        if (stored) cachePhoto(id, state.photoData);
        photoFields = stored ? { photo: "", hasPhoto: true } : { photo: state.photoData, hasPhoto: false };
      } else {
        photoFields = { photo: "", hasPhoto: false };
        removePhoto = !!(existing && existing.hasPhoto);
      }
    }
    const previousCatches = state.catches;
    if (existing) {
      state.catches = state.catches.map((c) => (c.id === existing.id ? { ...c, ...fields, ...(photoFields || {}) } : c));
    } else {
      const sessionId = state.activeSession ? state.activeSession.id : null;
      state.catches = [{ id, sessionId, ...fields, ...(photoFields || { photo: "", hasPhoto: false }) }, ...state.catches];
    }
    if (!saveCatches(state.catches)) { state.catches = previousCatches; return; }
    if (removePhoto) { PhotoDB.del(id).catch(() => {}); photoCache.delete(String(id)); }
    const wasEdit = !!existing;
    state.showForm = false;
    state.editingId = null;
    state.photoData = "";
    state.photoDirty = false;
    renderMain();
    window.scrollTo({ top: 0, behavior: "smooth" });
    checkNewAchievements();
    showSnackbar(wasEdit ? "Prise modifiée ✓" : `${speciesName(especeId)} ajouté(e) au journal ✓`);
    buzz(25);
  } finally {
    state.submitting = false;
    const b = document.getElementById("btn-submit-catch");
    if (b) b.disabled = false;
  }
}

async function buildBackupPayload() {
  const catches = [];

    if (c.hasPhoto && !c.photo) {
      const data = await getCatchPhoto(c);
      const copy = { ...c, photo: data || "" };
      delete copy.hasPhoto;
      catches.push(copy);
    } else {
      catches.push(c);
    }
  }
  return { app: "HookDex France", version: APP_VERSION, exportedAt: new Date().toISOString(), catches, sessions: state.sessions, spots: loadSpots() };
}
