/* ---------- météo automatique (Open-Meteo : gratuit, sans compte) ---------- */
const WMO_FR = { 0: "Ciel dégagé", 1: "Plutôt dégagé", 2: "Partiellement nuageux", 3: "Couvert", 45: "Brouillard", 48: "Brouillard givrant",
  51: "Bruine légère", 53: "Bruine", 55: "Bruine dense", 56: "Bruine verglaçante", 57: "Bruine verglaçante", 61: "Pluie faible", 63: "Pluie modérée",
  65: "Pluie forte", 66: "Pluie verglaçante", 67: "Pluie verglaçante", 71: "Neige faible", 73: "Neige", 75: "Neige forte", 77: "Grésil",
  80: "Averses", 81: "Averses", 82: "Fortes averses", 85: "Averses de neige", 86: "Averses de neige", 95: "Orage", 96: "Orage et grêle", 99: "Orage et grêle" };
const MARINE_CATEGORIES = ["mer_med", "mer_atl", "manche", "crustaces", "cephalopodes", "coquillages"];
function windDirFr(deg) { return ["N", "NE", "E", "SE", "S", "SO", "O", "NO"][Math.round((((deg % 360) + 360) % 360) / 45) % 8]; }
async function fetchJson(url, ms) {
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), ms || 12000) : null;
  try {
    const res = await fetch(url, ctrl ? { signal: ctrl.signal } : {});
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { if (timer) clearTimeout(timer); }
}
function daysAgo(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((today - new Date(y, m - 1, d)) / 86400000);
}
function hourlyValue(h, key, hour) {
  if (!h || !Array.isArray(h.time) || !h[key]) return null;
  let i = h.time.findIndex((t) => parseInt(String(t).slice(11, 13), 10) === hour);
  if (i < 0) i = Math.min(12, h.time.length - 1);
  const val = h[key][i];
  return val === null || val === undefined ? null : val;
}
async function fetchWeather(lat, lng, dateStr, hour) {
  const age = daysAgo(dateStr);
  if (age < -14) throw new Error("trop loin");
  const base = age > 60 ? "https://archive-api.open-meteo.com/v1/archive" : "https://api.open-meteo.com/v1/forecast";
  const url = `${base}?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`
    + "&hourly=temperature_2m,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m";
  const data = await fetchJson(url);
  const h = data && data.hourly;
  const w = { temp: hourlyValue(h, "temperature_2m", hour), code: hourlyValue(h, "weather_code", hour), pressure: hourlyValue(h, "pressure_msl", hour),
    wind: hourlyValue(h, "wind_speed_10m", hour), dir: hourlyValue(h, "wind_direction_10m", hour) };
  if (w.temp === null && w.code === null && w.pressure === null) throw new Error("vide");
  return w;
}
async function fetchSeaTemp(lat, lng, dateStr, hour) {
  const age = daysAgo(dateStr);
  if (age > 60 || age < -7) return null;
  const data = await fetchJson(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&timezone=auto&start_date=${dateStr}&end_date=${dateStr}&hourly=sea_surface_temperature`, 10000);
  return hourlyValue(data && data.hourly, "sea_surface_temperature", hour);
}
async function fillWeather() {
  const btn = document.getElementById("btn-weather");
  const status = (t) => { const el = document.getElementById("weather-status"); if (el) el.textContent = t; };
  const val = (id) => ((document.getElementById(id) || {}).value || "").trim();
  const setv = (id, x) => { const el = document.getElementById(id); if (el) el.value = x; };
  let lat = parseFloat(val("f-lat")), lng = parseFloat(val("f-lng"));
  if (!validLatLng(lat, lng) && state.activeSession && validLatLng(state.activeSession.lat, state.activeSession.lng)) {
    lat = +state.activeSession.lat; lng = +state.activeSession.lng;
  }
  if (!validLatLng(lat, lng)) { const pl = loadPlace(); if (pl) { lat = pl.lat; lng = pl.lng; setv("f-lat", lat.toFixed(5)); setv("f-lng", lng.toFixed(5)); } }
  if (btn) btn.disabled = true;
  try {
    if (!validLatLng(lat, lng)) {
      status("Localisation en cours…");
      try {
        const p = await new Promise((resolve, reject) => {
          if (!navigator.geolocation) { reject(new Error("geo")); return; }
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000, maximumAge: 300000 });
        });
        lat = p.coords.latitude; lng = p.coords.longitude;
        setv("f-lat", lat.toFixed(5)); setv("f-lng", lng.toFixed(5));
      } catch (e) { status("Position inconnue : utilise « 📍 Utiliser ma position » ou saisis les coordonnées, puis réessaie."); return; }
    }
    const dateStr = val("f-date") || localDateStr(new Date());
    const heure = val("f-heure");
    let hour = heure ? parseInt(heure.split(":")[0], 10) : new Date().getHours();
    if (isNaN(hour)) hour = 12;
    status("Récupération de la météo…");
    try {
      const w = await fetchWeather(lat, lng, dateStr, hour);
      const desc = [w.code !== null && WMO_FR[w.code] ? WMO_FR[w.code] : "", w.temp !== null ? `${Math.round(w.temp)}°C` : ""].filter(Boolean).join(", ");
      if (desc) setv("f-meteo", desc);
      if (w.wind !== null) setv("f-vent", `${Math.round(w.wind)} km/h${w.dir !== null ? " " + windDirFr(w.dir) : ""}`);
      if (w.pressure !== null) setv("f-pression", Math.round(w.pressure));
      let extra = "";
      const sp = speciesById(val("f-espece"));
      if (sp && MARINE_CATEGORIES.includes(sp.categorie) && !val("f-tempEau")) {
        try { const sst = await fetchSeaTemp(lat, lng, dateStr, hour); if (sst !== null) { setv("f-tempEau", (Math.round(sst * 10) / 10).toString()); extra = " + température de l'eau"; } } catch (e) {}
      }

    } catch (e) {
      status(navigator.onLine === false ? "Pas de connexion internet : réessaie plus tard ou remplis à la main." : "Météo indisponible pour cette date ou cette position.");
    }
  } finally { if (btn) btn.disabled = false; }
}

function drawLogoMark(ctx, x, y, width, bodyColor, eyeColor) {

  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.moveTo(14, 45); ctx.lineTo(66, 18); ctx.lineTo(108, 45); ctx.lineTo(66, 72); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(108, 45); ctx.lineTo(118, 30); ctx.lineTo(118, 60); ctx.closePath(); ctx.fill();
  ctx.fillStyle = eyeColor; ctx.beginPath(); ctx.arc(42, 40, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function fitText(ctx, text, maxWidth, fontFor, start, min) {
  let size = start;
  ctx.font = fontFor(size);
  while (size > min && ctx.measureText(text).width > maxWidth) { size -= 4; ctx.font = fontFor(size); }
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxWidth) t = t.slice(0, -1);
  return t + "…";
}

/* ---------- mise à jour de l'app ---------- */
const APP_VERSION = "4.0";
function checkForUpdate() {
  if (location.protocol === "file:" || navigator.onLine === false) return;
  // requête HEAD : ignorée par le service worker, elle interroge toujours GitHub
  fetch(location.href.split("#")[0], { method: "HEAD", cache: "no-store" }).then((res) => {
    if (!res.ok) return;
    const tag = res.headers.get("etag") || res.headers.get("last-modified");
    if (!tag) return;
    const known = localStorage.getItem("fdx_page_tag");
    localStorage.setItem("fdx_page_tag", tag);
    if (known && known !== tag) refreshAppCache(true).then(() => showSnackbar("Nouvelle version de HookDex disponible", "Mettre à jour", applyUpdate, 12000));
  }).catch(() => {});
}
// Remet la dernière version du site dans la mémoire hors ligne du téléphone :
// sans ça, l'app peut continuer à afficher éternellement l'ancienne copie mise en cache.
async function refreshAppCache(force) {
  if (!window.caches || location.protocol === "file:" || navigator.onLine === false) return false;
  const last = parseInt(localStorage.getItem("fdx_cache_refresh") || "0", 10);
  if (!force && Date.now() - last < 6 * 3600000) return false;
  try {
    const res = await fetch(`./index.html?fdx=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) return false;
    const html = await res.text();
    if (!/HookDex/.test(html)) return false;
    const keys = await caches.keys();
    const cache = await caches.open(keys[0] || "hookdex-cache-v1");
    for (const target of ["./", "./index.html"]) {
      await cache.put(new Request(new URL(target, location.href).href), new Response(html, { headers: { "Content-Type": "text/html; charset=utf-8" } }));
    }
    // on ne garde pas l'adresse temporaire en mémoire
    for (const key of keys) {
      const c = await caches.open(key);
      for (const req of await c.keys()) if (req.url.includes("?fdx=")) await c.delete(req);
    }
    localStorage.setItem("fdx_cache_refresh", String(Date.now()));
    const online = /const APP_VERSION = "([^"]+)"/.exec(html);
    return !!(online && online[1] !== APP_VERSION);
  } catch (e) { return false; }
}
async function applyUpdate() {
  try {
    if (window.caches) {
      for (const key of await caches.keys()) {
        const cache = await caches.open(key);
        for (const req of await cache.keys()) {
          const u = new URL(req.url);
          if (u.origin === location.origin && (u.pathname.endsWith("/") || u.pathname.endsWith(".html"))) await cache.delete(req);
        }
      }
    }
  } catch (e) {}
  location.reload();
}

let forecastFetching = false, forecastLastTry = 0;

    const d = await fetchJson(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&timezone=auto&timeformat=unixtime&past_days=1&forecast_days=7`
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,wind_direction_10m_dominant"
      + "&hourly=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation,pressure_msl,cloud_cover"

function speciesEnv(sp) { return ENV_OVERRIDE[sp.id] || (FRESH_CATS.includes(sp.categorie) ? "d" : "m"); }

/* ---------- dates des ouvertures (Code de l'environnement) ---------- */
function nthWeekday(y, m, wd, n) { const first = new Date(y, m, 1); return new Date(y, m, 1 + ((wd - first.getDay() + 7) % 7) + (n - 1) * 7); }
function lastWeekday(y, m, wd) { const last = new Date(y, m + 1, 0); return new Date(y, m, last.getDate() - ((last.getDay() - wd + 7) % 7)); }
function addDaysD(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function dayOnly(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function fmtDay(d) { const t = d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" }); return d.getDate() === 1 ? t.replace(/^1 /, "1er ") : t; }
// 1re catégorie : du 2e samedi de mars au 3e dimanche de septembre
function cat1Season(y) { return { start: nthWeekday(y, 2, 6, 2), end: nthWeekday(y, 8, 0, 3) }; }
function freshSeason(kind, cat, date) {
  const d = dayOnly(date), y = d.getFullYear();
  const c1 = cat1Season(y);
  const inC1 = d >= c1.start && d <= c1.end;
  const nextC1 = d < c1.start ? c1.start : cat1Season(y + 1).start;
  if (kind === "truite") return inC1 ? { open: true, text: `Ouverte jusqu'au ${fmtDay(c1.end)}` } : { open: false, text: `Fermée, réouverture le ${fmtDay(nextC1)}` };
  if (kind === "brochet") {
    if (cat === 1) {

    const s = freshSeason(rule.season || "general", cat, date);
    if (s.open === false) { out.level = "bad"; out.closedNow = { noKr: false }; out.pills.push(["bad", s.release ? "À relâcher" : "Fermée"]); }
    else if (s.open === true) out.pills.push(["ok", "Ouverte"]);

  if (zone !== "d") {
    const cl = (rule.closed || []).find((c) => inMMDD(date, c.from, c.to));
    if (cl) {
      out.level = "bad"; out.closedNow = cl;
      out.pills.push(["bad", cl.kr ? "Relâcher" : "Fermée"]);
      out.lines.push(escapeHtml(`Du ${mmddLabel(cl.from)} au ${mmddLabel(cl.to)} : ${cl.kr ? "pêcher-relâcher uniquement" : "pêche interdite" + (cl.noKr ? ", pêcher-relâcher compris" : "")}.`));
    } else if (rule.auth) out.pills.push(["warn", "Sur autorisation"]);
    else if (rule.seasonTxt) out.pills.push(["info", "Voir l'arrêté"]);
    else out.pills.push(["ok", "Ouverte"]);

  if (rule.min) {
    const applies = !rule.minCat || zone !== "d" || rule.minCat === cat;
    out.lines.push(`Taille minimale : <b>${fmtCm(rule.min)}</b>${rule.minCat && zone === "d" ? " en 2e catégorie" : ""}${rule.minNote ? " (" + escapeHtml(rule.minNote) + ")" : ""}`);

/* ---------- aide dans le formulaire de prise ---------- */
function updateRegHint() {
  const el = document.getElementById("reg-hint");
  if (!el) return;
  const sp = speciesById((document.getElementById("f-espece") || {}).value);
  if (!sp) { el.innerHTML = ""; return; }
  const val = (id) => String((document.getElementById(id) || {}).value || "").trim();
  const size = parseFloat(val("f-taille").replace(",", "."));
  const released = !!(document.getElementById("f-relachee") || {}).checked;
  const ds = val("f-date");
  const date = /^\d{4}-\d{2}-\d{2}$/.test(ds) ? new Date(+ds.slice(0, 4), +ds.slice(5, 7) - 1, +ds.slice(8, 10)) : new Date();
  const zone = regZoneFor(sp, parseFloat(val("f-lat")), parseFloat(val("f-lng")));
  const ev = regEvaluate(sp, { zone, cat: state.regCat || 2, date, size: size > 0 ? size : null });
  if (ev.level === "none") {
    const r = categorizeRegulation(sp.reglementation);
    el.innerHTML = r.label === "Pêchable" ? "" : `<span style="color:${r.color}; font-weight:600;">${r.emoji} ${escapeHtml(sp.reglementation)}</span> <span style="color:var(--muted);">(indicatif)</span>`;
    return;
  }
  let warn = "", good = false;
  if (ev.rule.ban) { warn = released ? "Relâché : c'est obligatoire pour cette espèce." : "⚠️ Espèce interdite ici : remise à l'eau immédiate."; good = released; }
  else if (ev.rule.invasive) { warn = released ? "⚠️ Cette espèce ne doit pas être relâchée vivante." : ""; }
  else if (ev.closedNow && ev.closedNow.noKr) warn = "⚠️ Pêche interdite en ce moment, même en pêcher-relâcher.";
  else if (ev.sizeBad) { warn = released ? "Sous la taille minimale et relâché : parfait." : `⚠️ ${size} cm : sous la taille minimale de ${fmtCm(ev.rule.min)}, à remettre à l'eau.`; good = released; }
  else if (ev.closedNow) { warn = released ? "Période fermée et relâché : c'est la règle." : "⚠️ Pêche fermée pour cette espèce à cette date : remise à l'eau."; good = released; }
  el.innerHTML = `<div>${pillsHtml(ev.pills)} <span style="color:var(--muted); font-size:11.5px;">${ZONE_LABELS[zone]}</span></div>
    <div class="reg-lines" style="color:var(--muted);">${ev.lines.slice(0, 3).map((l) => `<div>${l}</div>`).join("")}</div>
    ${warn ? `<div style="color:${good ? "var(--ok)" : "var(--bad)"}; font-weight:600; margin-top:4px;">${good ? "✓ " : ""}${warn}</div>` : ""}`;
}

function renderRegList(zone, cat, q) {
  const nq = normalizeText(q || "");
  const today = new Date();
  const items = SPECIES.filter((sp) => regRule(sp.id, zone) && !regRule(sp.id, zone).ban && !/albinos|melanique/.test(sp.id) && (!nq || normalizeText(sp.nom).includes(nq)));
  if (!items.length) return `<div class="empty-hint" style="border:none;">${nq ? "Aucune espèce réglementée ne correspond." : "Aucune règle nationale spécifique ici."}</div>`;
  return items.map((sp) => {
    const ev = regEvaluate(sp, { zone, cat, date: today });
    return `<div class="rule"><div class="r-h"><button class="r-name" data-open-species="${sp.id}">${escapeHtml(sp.nom)}</button><span>${pillsHtml(ev.pills.slice(0, 2))}</span></div>
      <div class="r-lines">${ev.lines.map((l) => `<div>${l}</div>`).join("")}</div></div>`;
  }).join("");
}
function regVerdictHtml(sp, zone, cat, size) {
  const ev = regEvaluate(sp, { zone, cat, date: new Date(), size });
  if (ev.level === "none") return `<div class="verdict">Pas de règle nationale spécifique pour cette espèce ici. Vérifie l'arrêté local.</div>`;
  let head;
  if (ev.rule.ban) head = `<b style="color:var(--bad);">Interdit</b> : relâche-le immédiatement.`;
  else if (ev.rule.invasive) head = `<b style="color:var(--warn);">Ne pas relâcher</b> vivant.`;
  else if (ev.sizeBad) head = `<b style="color:var(--bad);">Trop petit</b> : ${String(size).replace(".", ",")} cm pour ${fmtCm(ev.rule.min)} minimum, à relâcher.`;
  else if (ev.closedNow) head = `<b style="color:var(--bad);">Période fermée</b> : ${ev.closedNow.noKr ? "pêche interdite, même en pêcher-relâcher" : "à relâcher"}.`;
  else if (size > 0 && ev.rule.min) head = `<b style="color:var(--ok);">Maillé ✓</b> : ${String(size).replace(".", ",")} cm, au-dessus des ${fmtCm(ev.rule.min)}.`;
  else if (ev.rule.min) head = `<b>Entre la taille</b> pour vérifier.`;
  else head = `<b>À vérifier</b> sur place.`;
  return `<div class="verdict">${head}<div class="reg-lines" style="color:var(--muted); font-size:12.5px;">${ev.lines.map((l) => `<div>${l}</div>`).join("")}</div></div>`;
}
function renderRegles() {
  const place = loadPlace();
  const milieu = state.regMilieu || currentMilieu();
  const facade = state.regFacade || currentFacade();

  const deptName = DEPTS[dept] || "";

    const ev = regEvaluate(sp, { zone, cat, date: now });
    const main = ev.pills.find((p) => p[0] === "bad") || ev.pills.find((p) => p[0] === "ok") || ev.pills[0] || ["info", "—"];
    return `<button class="r-name" data-open-species="${sp.id}">${escapeHtml(sp.nom)}</button><span class="pill ${main[0]}">${escapeHtml(main[1])}</span>`;
  }).join("");
  const pos = getSolunarPosition();
  const sol = solunarFor(localDateStr(now), pos.lat, pos.lng);
  const banned = SPECIES.filter((sp) => { const r = regRule(sp.id, zone); return r && r.ban && !/albinos/.test(sp.id); });
  const checkOptions = SPECIES.filter((sp) => !/albinos|melanique|^koi_/.test(sp.id) && (speciesEnv(sp) === "dm" || speciesEnv(sp) === (zone === "d" ? "d" : "m")))
    .sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
  const g = (q) => `https://www.google.com/search?q=${encodeURIComponent(q)}`;
  const links = zone === "d"
    ? [[g(`arrêté réglementation pêche eau douce ${deptName || ""} ${year}`), `Arrêté pêche ${year}${deptName ? " – " + deptName : " de ton département"}`],
       [g(`fédération de pêche ${deptName || ""} réglementation ${year}`), `Fédération de pêche${deptName ? " – " + deptName : ""}`],

        zone === "med" ? "Direction de la mer Méditerranée (DIRM)" : "Direction de la mer Atlantique–Manche (DIRM)"],
       [g(`pêche de loisir en mer réglementation ${FACADES[zone].short} ${year}${deptName ? " " + deptName : ""}`), `Règles locales ${year}${deptName ? " – " + deptName : ""}`],
       [g("RecFishing application pêche de loisir"), "Appli RecFishing (déclaration des captures)"]];
  return `
    <div class="reg-head"><h1>Règles de pêche</h1><span class="pill info">${zone === "d" ? "Eau douce" : FACADES[zone].short}</span></div>
    <div class="reg-ctx">${place ? `Pour ${escapeHtml(placeName(place))}${deptName ? ` (${escapeHtml(deptName)})` : ""}, au ${fmtDay(now)}.` : `Règles nationales au ${fmtDay(now)}. <button class="icon-btn-flat" id="btn-open-picker" style="font-size:12.5px; text-decoration:underline; color:var(--accent); padding:0;">Choisis ton coin</button> pour les adapter.`}</div>
    <div class="seg" style="margin-top:12px;"><button data-reg-milieu="douce" class="${zone === "d" ? "active" : ""}">Eau douce</button><button data-reg-milieu="mer" class="${zone !== "d" ? "active" : ""}">Mer</button></div>
    ${zone === "d"
      ? `<div class="seg"><button data-reg-cat="1" class="${cat === 1 ? "active" : ""}">1re catégorie</button><button data-reg-cat="2" class="${cat === 2 ? "active" : ""}">2e catégorie</button></div>
         <div class="h-note" style="margin:-6px 0 12px;">La catégorie figure sur la carte de ta fédération : 1re = cours d'eau à truites, 2e = rivières lentes, lacs et canaux.</div>`
      : `<div class="seg">${["med", "atl", "manche"].map((f) => `<button data-reg-facade="${f}" class="${zone === f ? "active" : ""}">${FACADES[f].short}</button>`).join("")}</div>`}
    <div class="card" style="margin-bottom:12px;">
      <div class="section-title" style="margin-top:0;">Aujourd'hui</div>
      <div class="status-grid">${statusRows}</div>
      ${zone === "d" ? `<div class="h-note">Horaires légaux ici : <b>${sol.sun.rise ? formatHM(sol.sun.rise - 1800000) : "–"} → ${sol.sun.set ? formatHM(sol.sun.set + 1800000) : "–"}</b></div>` : ""}

    <div class="section-title">Textes officiels</div>
    <div class="card link-list" style="padding-top:2px; padding-bottom:2px;">${links.map(([u, t]) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${escapeHtml(t)} <span>↗</span></a>`).join("")}</div>
    <p class="h-note">Sources : Code de l'environnement (articles R436-6 à R436-21) pour l'eau douce ; arrêté du 26 octobre 2012 modifié pour les tailles en mer ; règles européennes 2026 pour le bar et le lieu jaune ; obligation RecFishing 2026. Vérifié en ${REG_UPDATED}. L'arrêté de ton département (eau douce) ou de ta préfecture (mer) peut être plus strict : c'est lui qui fait foi.</p>
  `;
}
function attachReglesHandlers() {
  const zoneNow = () => ((state.regMilieu || currentMilieu()) === "douce" ? "d" : state.regFacade || currentFacade());
  document.querySelectorAll("[data-reg-milieu]").forEach((b) => { b.onclick = () => { state.regMilieu = b.dataset.regMilieu; renderMain(); }; });
  document.querySelectorAll("[data-reg-cat]").forEach((b) => { b.onclick = () => { state.regCat = +b.dataset.regCat; renderMain(); }; });
  document.querySelectorAll("[data-reg-facade]").forEach((b) => { b.onclick = () => { state.regFacade = b.dataset.regFacade; renderMain(); }; });
  const search = document.getElementById("reg-search");
  if (search) search.oninput = () => {
    state.regSearch = search.value;
    const list = document.getElementById("reg-list");
    if (list) {
      list.innerHTML = renderRegList(zoneNow(), state.regCat || 2, search.value);
      list.querySelectorAll("[data-open-species]").forEach((b) => { b.onclick = () => { state.detailSpeciesId = b.dataset.openSpecies; render(); }; });
    }
  };
  const sel = document.getElementById("reg-check-sp"), size = document.getElementById("reg-check-size"), out = document.getElementById("reg-verdict");
  const upd = () => {
    const sp = speciesById(sel.value);
    if (!sp) { out.innerHTML = ""; return; }
    const z = speciesEnv(sp) === "d" ? "d" : speciesEnv(sp) === "m" && zoneNow() === "d" ? currentFacade() : zoneNow();
    out.innerHTML = regVerdictHtml(sp, z, state.regCat || 2, parseFloat(String(size.value).replace(",", ".")) || null);
  };
  if (sel && size && out) { sel.onchange = upd; size.oninput = upd; }
}

    if (w > maxDim || h > maxDim) { if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; } else { w = Math.round(w * (maxDim / h)); h = maxDim; } }
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(img, 0, 0, w, h);
    return cv.toDataURL("image/jpeg", photoDbReady ? 0.8 : 0.68);
  });
}
async function identPick(id) {
  const q = identQ;
  if (!q) return;
  const photo = q.photo, size = q.size;
  closeIdentify();
  identQ = null;
  if (!q.fromForm) openNewCatchForm({ especeId: id, taille: size || "" });
  const sel = document.getElementById("f-espece");
  if (sel) {
    sel.value = id;
    updateFormFieldsVisibility(id);
    document.querySelectorAll("[data-pick-species]").forEach((c) => c.classList.toggle("active", c.dataset.pickSpecies === id));
  }
  const tailleEl = document.getElementById("f-taille");
  if (tailleEl && size && !tailleEl.value) { tailleEl.value = size; updateRegHint(); }
  if (photo && photo !== state.photoData) {
    try {
      const small = photo.length > 900000 || !/^data:image\/jpeg/.test(photo) ? await compressDataUrl(photo) : photo;
      state.photoData = small;
      state.photoDirty = true;
      const preview = document.getElementById("photo-preview");
      if (preview) preview.innerHTML = photoPreviewHtml(small);
      attachPhotoRemove();
    } catch (e) {}
  }
  showSnackbar(`${speciesName(id)} sélectionné(e)`);
}

function attachSheetHandlers() {
  const overlay = document.getElementById("sheet-overlay");
  const close = () => { state.sheet = null; render(); };
  if (overlay) overlay.onclick = (e) => { if (e.target === overlay) close(); };
  document.querySelectorAll("[data-sheet-close]").forEach((b) => { b.onclick = close; });
  document.querySelectorAll("[data-sheet-tab]").forEach((b) => {
    b.onclick = () => { state.sheet = null; state.tab = b.dataset.sheetTab; state.showForm = false; render(); window.scrollTo(0, 0); };
  });
  document.querySelectorAll("[data-sheet-act]").forEach((b) => {
    b.onclick = () => {
      const act = b.dataset.sheetAct;
      state.sheet = null;
      if (act === "catch") { openNewCatchForm(); return; }
      if (act === "ident") { render(); openIdentify(); return; }
      if (act === "place") { render(); openPicker("place"); return; }
      if (act === "settings") { state.showSettings = true; render(); return; }
      if (act === "theme") { state.theme = resolveTheme() === "dark" ? "light" : "dark"; saveTheme(state.theme); render(); return; }
      if (act === "share-backup") { render(); shareBackup(); return; }
      if (act === "session") {
        state.tab = "accueil"; state.showForm = false;
        if (!state.activeSession) { state.showSessionSetup = true; state.sessionSetupIsEdit = false; state.sessionSetupTargets = []; state.sessionSetupSearch = ""; }
        render();
        setTimeout(() => {
          const el = document.getElementById("session-lieu") || document.getElementById("btn-session-add-catch") || document.getElementById("btn-start-session");
          if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 60);
        return;
      }
      render();
    };
  });
}
async function useGpsAsPlace() {
  showSnackbar("Localisation en cours…", null, null, 4000);
  try {
    const p = await getGps();
    const lat = p.coords.latitude, lng = p.coords.longitude;
    let g = null;
    try { g = await reverseCommune(lat, lng); } catch (e) {}
    const pl = savePlace({ lat, lng, commune: g ? g.commune : "", dept: g ? g.dept : "", milieu: g && g.atSea ? "mer" : currentMilieu(), source: "gps" });
    afterPlaceChange(pl);
  } catch (e) { showSnackbar("Impossible d'obtenir ta position : active la localisation"); }
}
// Branchements des nouveaux écrans (appelé à chaque rendu du contenu principal)
function attachV4Handlers() {
  const byId = (id) => document.getElementById(id);
  document.querySelectorAll("#btn-open-picker").forEach((b) => { b.onclick = () => openPicker("place"); });
  const hr = byId("btn-hero-refresh");
  if (hr) hr.onclick = () => { showSnackbar("Actualisation de la météo…", null, null, 1500); refreshForecast(true); refreshMarine(true); };
  const hw = byId("btn-hero-weather");
  if (hw) hw.onclick = () => {
    localStorage.setItem("fdx_weather_home", "1");
    localStorage.removeItem("fdx_weather_off");
    showSnackbar("Météo activée : chargement…", null, null, 2500);
    refreshForecast(true);
    refreshMarine(true);
    renderMain();
  };
  document.querySelectorAll("[data-use-spot]").forEach((b) => {
    b.onclick = () => { const s = loadSpots().find((x) => x.id === b.dataset.useSpot); if (s) useSpot(s); };
  });
  document.querySelectorAll("[data-del-spot]").forEach((b) => {
    b.onclick = () => {
      const s = loadSpots().find((x) => x.id === b.dataset.delSpot);
      if (!s || !confirm(`Supprimer le coin « ${s.name} » ?`)) return;
      deleteSpot(s.id);
      const pl = loadPlace();
      if (pl && pl.spotId === s.id) savePlace({ ...pl, spotId: null, name: "" });
      render();
    };
  });
  document.querySelectorAll("[data-goto-regles]").forEach((b) => {
    b.onclick = () => {
      const z = b.dataset.gotoRegles;
      state.detailSpeciesId = null;
      state.tab = "regles";
      state.regMilieu = z === "d" ? "douce" : "mer";
      if (z !== "d") state.regFacade = z;
      render();
      window.scrollTo(0, 0);
    };
  });
  const fp = byId("btn-form-place");
  if (fp) fp.onclick = () => {
    const p = loadPlace();
    if (!p) { openPicker("form"); return; }
    byId("f-lat").value = p.lat.toFixed(5);
    byId("f-lng").value = p.lng.toFixed(5);
    const st = byId("gps-status");
    if (st) st.textContent = `Position de ton coin (${placeName(p)}) ✓`;
    updateRegHint();
  };
  const fm = byId("btn-form-map");
  if (fm) fm.onclick = () => {
    const lat = parseFloat(byId("f-lat").value), lng = parseFloat(byId("f-lng").value);
    openPicker("form", validLatLng(lat, lng) ? { start: { lat, lng, zoom: 15 } } : null);
  };
  const fi = byId("btn-form-ident");
  if (fi) fi.onclick = () => {
    const sp = speciesById((byId("f-espece") || {}).value);
    openIdentify({ fromForm: true, photo: state.photoData || "", size: (byId("f-taille") || {}).value || "", milieu: sp ? (speciesEnv(sp) === "d" ? "douce" : speciesEnv(sp) === "m" ? "mer" : currentMilieu()) : currentMilieu() });
  };
  ["f-date", "f-lat", "f-lng"].forEach((id) => { const el = byId(id); if (el) el.addEventListener("input", updateRegHint); });
  const hs = byId("hour-strip");
  if (hs) hs.scrollLeft = 0;
  if (state.tab === "regles") attachReglesHandlers();
  if (state.tab === "accueil") refreshMarine(false);
}
