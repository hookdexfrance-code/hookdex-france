<style>
:root {
  --bg:#0A0A0A; --header:#131313; --card:#171717; --border:#2C2C2C;
  --text:#F5F5F5; --muted:#8C8C8C; --input:#0A0A0A;
  --accent:#FF5A36; --accent2:#C2431F; --track:#262626;
}
body.light {
  --bg:#FAFAFA; --header:#FFFFFF; --card:#FFFFFF; --border:#E2E2E2;
  --text:#111111; --muted:#6E6E6E; --input:#FAFAFA;
  --accent:#E8481F; --accent2:#B23A18; --track:#ECECEC;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; overscroll-behavior-y: contain; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  padding-bottom: 76px;
  min-height: 100vh;
}
.oswald { font-family: 'Oswald', 'Arial Narrow', sans-serif; }
.mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
button, input, select, textarea { font-family: inherit; }
a { color: inherit; }

header.app-header {
  position: sticky; top:0; z-index: 10; display:flex; justify-content:space-between; align-items:center;
  padding: 14px 18px; background: var(--header); border-bottom: 1px solid var(--border);
}
.header-left { display:flex; align-items:center; gap:8px; }
.header-title { font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; }
.header-title span { color: var(--accent); }
.theme-btn { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:7px 9px; cursor:pointer; font-size:16px; }

main.app-main { max-width: 560px; margin: 0 auto; padding: 18px 16px; }

.card { border:1px solid var(--border); border-radius:10px; padding:14px; background: var(--card); }
.hero-card { border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:18px;
  background: linear-gradient(135deg, var(--card) 0%, var(--header) 100%); }
.progress-row { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
.primary-btn { display:flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:8px;
  padding:12px 18px; font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; text-transform:uppercase;
  letter-spacing:0.03em; cursor:pointer; width:100%; background: var(--accent); color: var(--bg); }
.primary-btn:active { transform: scale(0.97); }
.stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:6px; }
.mini-stat { text-align:center; padding:14px 10px; }
.mini-stat .icon { margin-bottom:6px; font-size:16px; }
.mini-stat .value { font-family:'IBM Plex Mono',monospace; font-size:19px; }
.mini-stat .label { font-size:10.5px; color:var(--muted); margin-top:2px; }
.section-title { display:flex; align-items:center; gap:6px; margin:22px 0 10px; color:var(--muted); font-size:12px;
  text-transform:uppercase; letter-spacing:0.06em; }
.empty-hint { text-align:center; padding:30px 16px; border:1px dashed var(--border); border-radius:10px; color:var(--muted); font-size:13.5px; }
.link-card { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; font-size:13.5px;
  background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; }

.search-bar { display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:10px; padding:10px 12px;
  margin-bottom:14px; background:var(--card); }
.search-bar input { border:none; outline:none; background:transparent; font-size:14px; flex:1; color:var(--text); }
.chips-row { display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
.chip { background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:20px; padding:6px 13px;
  font-size:12px; cursor:pointer; white-space:nowrap; flex-shrink:0; }
.chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight:600; }

.dex-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.dex-card { display:flex; flex-direction:column; align-items:center; border:1px solid var(--border); border-radius:12px;
  padding:14px 8px; gap:2px; background:var(--card); cursor:pointer; text-align:center; }
.dex-card .icon-wrap { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  margin-bottom:8px; font-size:19px; }
.dex-card .name { font-size:13px; font-weight:600; color:var(--text); line-height:1.25; }
.dex-card .cat { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; }

.form-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.form-title { font-family:'Oswald',sans-serif; font-size:16px; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field label { font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); }
.field input, .field select, .field textarea {
  border:1px solid var(--border); border-radius:6px; padding:9px 11px; font-size:13.5px; width:100%;
  background:var(--input); color:var(--text);
}
.field textarea { min-height:60px; resize:vertical; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
.small-btn { display:inline-flex; align-items:center; gap:5px; background:transparent; border:1px solid var(--border);
  color:var(--muted); border-radius:7px; padding:8px 12px; font-size:12.5px; cursor:pointer; }
.icon-btn-flat { background:transparent; border:none; padding:4px; cursor:pointer; color:var(--muted); font-size:16px; }
.journal-top-row { display:flex; gap:8px; margin-bottom:14px; }
.gps-status { font-size:11.5px; color:var(--muted); margin-top:4px; }

nav.bottom-nav { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:8px 2px;

.nav-btn { background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;

.nav-btn.active { color: var(--accent); }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.modal { width:100%; max-width:560px; max-height:85vh; overflow-y:auto; border:1px solid var(--border); border-top-left-radius:16px;

.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px; }
.modal-stat .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
.modal-stat .v { font-size:13.5px; color:var(--text); font-family:'IBM Plex Mono',monospace; margin-top:2px; }
.modal-row { margin-top:10px; }
.modal-row .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
.modal-row .v { font-size:13px; color:var(--text); margin-top:2px; line-height:1.45; }

.catch-card { border:1px solid var(--border); border-radius:10px; padding:14px; background:var(--card); margin-bottom:10px; }
.catch-card img { margin-top:8px; max-height:160px; width:100%; object-fit:cover; border-radius:8px; }
.catch-meta { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
.catch-note { font-size:13px; color:var(--text); margin-top:8px; border-top:1px solid var(--border); padding-top:8px; }

.bar-chart { display:flex; align-items:flex-end; gap:5px; height:140px; padding-top:10px; }
.bar-chart .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.bar-chart .bar { width:100%; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; }
.bar-chart .bar-label { font-size:9px; color:var(--muted); margin-top:4px; }
.season-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.season-card { text-align:center; }
.season-card .val { font-size:20px; font-family:'IBM Plex Mono',monospace; color:var(--accent); }
.season-card .lbl { font-size:11.5px; color:var(--muted); text-transform:capitalize; }

.ach-item { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.ach-item .check { font-size:20px; }
.ach-item .txt-title { font-family:'Oswald',sans-serif; font-size:15px; color:var(--text); }
.ach-item .txt-desc { font-size:12px; color:var(--muted); }

.install-banner { display:none; background: var(--card); border:1px solid var(--accent); border-radius:10px; padding:12px 14px;
  margin-bottom:16px; font-size:12.5px; color:var(--text); line-height:1.5; }
.install-banner.show { display:block; }
.install-banner b { color: var(--accent); }

#splash-screen { position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px; transition: opacity 0.5s ease; }
#splash-screen.fade-out { opacity:0; pointer-events:none; }
#splash-screen .splash-logo { animation: splash-pop 0.7s cubic-bezier(0.34,1.56,0.64,1); }
#splash-screen .splash-title { font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--text); opacity:0; animation: splash-fade 0.6s ease 0.3s forwards; }
#splash-screen .splash-sub { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:0.1em;
  text-transform:uppercase; opacity:0; animation: splash-fade 0.6s ease 0.5s forwards; }
@keyframes splash-pop { 0% { transform:scale(0.6); opacity:0; } 100% { transform:scale(1); opacity:1; } }
@keyframes splash-fade { to { opacity:1; } }
.fdx-logo-mark polygon { fill: var(--text); }
.fdx-logo-mark circle { fill: var(--accent); }

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius:3px; }

.fdx-toast {
  position:fixed; top:14px; left:50%; z-index:200; max-width:340px; width:calc(100% - 32px);
  transform:translate(-50%, -30px); opacity:0; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
  background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:12px 14px;
  display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,0.35);
}
.fdx-toast.show { transform:translate(-50%, 0); opacity:1; }
.fdx-toast-icon { font-size:24px; flex-shrink:0; }
.fdx-toast-title { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); }
.fdx-toast-label { font-family:'Oswald',sans-serif; font-size:15px; color:var(--text); margin-top:1px; }

.fdx-confetti-piece { position:fixed; top:-40px; z-index:150; pointer-events:none; will-change:transform, opacity; }
@keyframes fdx-confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity:1; }
  100% { transform: translateY(112vh) rotate(720deg); opacity:0; }
}

.cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.cal-nav-btn { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:16px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-weekday { text-align:center; font-size:10px; color:var(--muted); text-transform:uppercase; padding-bottom:4px; }
.cal-day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  border-radius:8px; border:1px solid var(--border); cursor:pointer; font-size:12px; position:relative; background:var(--card); color:var(--text); }
.cal-day.today { border-color:var(--accent); border-width:2px; }
.cal-day.selected { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.cal-day.empty { visibility:hidden; border:none; cursor:default; }
.cal-day .cal-moon { font-size:10px; line-height:1; }
.cal-day .cal-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); }
.cal-day.selected .cal-dot { background:var(--bg); }
.cal-detail { margin-top:16px; }

/* --- ajouts v2 --- */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible {
  outline:2px solid var(--accent); outline-offset:2px;
}
.nav-btn { transition: color 0.15s ease; }
.nav-btn.active span:first-child { transform: translateY(-1px); }
.fdx-snackbar {
  position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:210; transform:translate(-50%, 20px);
  opacity:0; transition: transform 0.25s ease, opacity 0.25s ease; pointer-events:none;
  width:calc(100% - 32px); max-width:420px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--text); color:var(--bg); border-radius:10px; padding:12px 14px; font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
}
.fdx-snackbar.show { transform:translate(-50%, 0); opacity:1; pointer-events:auto; }
.fdx-snackbar button { background:transparent; border:none; color:var(--accent); font-weight:600; font-size:13.5px; cursor:pointer; padding:4px 6px; }
.today-strip { display:flex; align-items:center; gap:12px; margin-bottom:18px; padding:12px 14px; }
.today-strip .moon { font-size:28px; line-height:1; }
.storage-bar { height:6px; border-radius:3px; background:var(--track); overflow:hidden; margin-top:8px; }
.storage-bar > div { height:100%; background:var(--accent); }
.lock-hint { border:1px dashed var(--border); border-radius:10px; padding:12px; margin-top:12px; }
.lock-hint .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
.lock-hint .v { font-size:13px; margin-top:2px; line-height:1.45; }
/* --- ajouts v3 --- */
.timeline { position:relative; height:22px; border-radius:6px; background:var(--track); overflow:hidden; margin-top:12px; }
.timeline .tl-day { position:absolute; top:0; bottom:0; background:rgba(255,196,64,0.14); }
body.light .timeline .tl-day { background:rgba(255,170,0,0.18); }
.timeline .tl-major, .timeline .tl-minor { position:absolute; border-radius:4px; background:var(--accent); }
.timeline .tl-major { top:4px; bottom:4px; }
.timeline .tl-minor { top:8px; bottom:8px; opacity:0.55; }

.tl-ticks { display:flex; justify-content:space-between; font-size:9.5px; color:var(--muted); margin-top:3px; font-family:'IBM Plex Mono',monospace; }

.sol-now { margin-top:10px; font-size:12.5px; color:var(--text); line-height:1.45; }
.sol-now b { color:var(--accent); }
.rating-dots { display:inline-flex; gap:3px; vertical-align:middle; }
.rating-dots i { width:7px; height:7px; border-radius:50%; background:var(--track); display:inline-block; }
.rating-dots i.on { background:var(--accent); }
.backup-card { border-color:var(--accent); margin-bottom:18px; font-size:12.5px; line-height:1.5; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.seg { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:14px; }
.seg button { flex:1; background:transparent; border:none; color:var(--muted); padding:8px 4px; font-size:12px; cursor:pointer; }
.seg button + button { border-left:1px solid var(--border); }

.thumb { width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--track); }
.cal-day .cal-star { position:absolute; top:2px; right:4px; font-size:8px; color:var(--accent); }
.cal-day.selected .cal-star { color:var(--bg); }
.weather-status { font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.4; }

.leaflet-popup-content { font-family:'IBM Plex Sans',sans-serif; font-size:13px; }
.catch-actions { display:flex; gap:0; flex-shrink:0; }

/* --- ajouts v3.1 --- */
.week-row { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
.week-day { background:transparent; border:1px solid transparent; border-radius:10px; padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text); cursor:pointer; font-family:inherit; min-width:0; }

  *, *::before, *::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }

<div id="splash-screen">
  <svg class="fdx-logo-mark splash-logo" width="88" height="88" viewBox="0 0 120 90">
    <polygon points="14,45 66,18 108,45 66,72"></polygon>
    <polygon points="108,45 118,30 118,60"></polygon>
    <circle cx="42" cy="40" r="6"></circle>
  </svg>
  <div class="splash-title">HookDex France</div>

<div id="app"></div>
<script>
/* Filet de sécurité : si l'affichage plante, on garde toujours un accès à ses données */
window.__fdxBooted = false;
window.__fdxEmergencyExport = function () {
  var catches = [], sessions = [];
  try { catches = JSON.parse(localStorage.getItem("fdx_catches") || "[]"); } catch (e) { catches = [{ brut: localStorage.getItem("fdx_catches") }]; }
  try { sessions = JSON.parse(localStorage.getItem("fdx_sessions") || "[]"); } catch (e) { sessions = []; }
  if (!Array.isArray(catches)) catches = [];
  var finish = function () {
    var blob = new Blob([JSON.stringify({ app: "HookDex France", exportedAt: new Date().toISOString(), catches: catches, sessions: sessions })], { type: "application/json" });

function getMoonPhase(date) {
  // Approximation astronomique classique (mois synodique moyen), calcul purement mathématique, fonctionne hors ligne
  const synodicMonth = 29.53058867;
  const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
  const diffDays = (date.getTime() - knownNewMoon) / 86400000;
  let phase = (diffDays % synodicMonth) / synodicMonth;
  if (phase < 0) phase += 1;
  return phase; // 0 = nouvelle lune, 0.5 = pleine lune
}

  const emojis = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
  return emojis[Math.round(phase * 8) % 8];
}
function moonPhaseLabel(phase) {
  if (phase < 0.03 || phase > 0.97) return "Nouvelle lune";
  if (phase < 0.22) return "Premier croissant";
  if (phase < 0.28) return "Premier quartier";
  if (phase < 0.47) return "Lune gibbeuse croissante";
  if (phase < 0.53) return "Pleine lune";
  if (phase < 0.72) return "Lune gibbeuse décroissante";
  if (phase < 0.78) return "Dernier quartier";
  return "Dernier croissant";
}
const SEASONS = { hiver:[12,1,2], printemps:[3,4,5], ete:[6,7,8], automne:[9,10,11] };
function seasonOf(month) { for (const [name,months] of Object.entries(SEASONS)) if (months.includes(month)) return name; return "?"; }

/* ---------- astronomie hors ligne : soleil, lune, périodes solunaires ---------- */
const Astro = (() => {
  const PI = Math.PI, rad = PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, obliq = rad * 23.4397;
  const toDays = (date) => date.valueOf() / dayMs - 0.5 + J1970 - J2000;
  const rightAscension = (l, b) => Math.atan2(Math.sin(l) * Math.cos(obliq) - Math.tan(b) * Math.sin(obliq), Math.cos(l));
  const declination = (l, b) => Math.asin(Math.sin(b) * Math.cos(obliq) + Math.cos(b) * Math.sin(obliq) * Math.sin(l));
  const altitude = (H, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const siderealTime = (d, lw) => rad * (280.16 + 360.9856235 * d) - lw;
  const wrap = (a) => { a = a % (2 * PI); if (a > PI) a -= 2 * PI; if (a <= -PI) a += 2 * PI; return a; };
  function sunCoords(d) {
    const M = rad * (357.5291 + 0.98560028 * d);
    const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const L = M + C + rad * 102.9372 + PI;
    return { ra: rightAscension(L, 0), dec: declination(L, 0) };
  }
  function moonCoords(d) {
    const L = rad * (218.316 + 13.176396 * d), M = rad * (134.963 + 13.064993 * d), F = rad * (93.272 + 13.22935 * d);
    const l = L + rad * 6.289 * Math.sin(M), b = rad * 5.128 * Math.sin(F);
    return { ra: rightAscension(l, b), dec: declination(l, b), dist: 385001 - 20905 * Math.cos(M) };
  }
  function bodyState(body, t, lat, lng) {
    const d = toDays(new Date(t)), c = body === "sun" ? sunCoords(d) : moonCoords(d);
    const H = siderealTime(d, rad * -lng) - c.ra;
    return { alt: altitude(H, rad * lat, c.dec), H: wrap(H) };
  }
  function illumination(date) {
    const d = toDays(date), s = sunCoords(d), m = moonCoords(d), sdist = 149598000;
    const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
    const inc = Math.atan2(sdist * Math.sin(phi), m.dist - sdist * Math.cos(phi));
    return (1 + Math.cos(inc)) / 2;
  }
  // Échantillonnage de la journée locale (toutes les 10 min) puis interpolation linéaire
  function dayEvents(body, dayStart, lat, lng) {
    const step = 10 * 60000, n = 146, h0 = body === "sun" ? -0.833 * rad : 0.125 * rad;
    const samples = [];
    for (let i = 0; i < n; i++) { const t = dayStart.getTime() + i * step; samples.push({ t, ...bodyState(body, t, lat, lng) }); }
    const dayEnd = dayStart.getTime() + 24 * 3600000;
    const ev = { rise: null, set: null, transit: null, underfoot: null };
    for (let i = 1; i < n; i++) {
      const a = samples[i - 1], b = samples[i];
      if (a.t >= dayEnd) break;
      const lerp = (fa, fb) => a.t + (b.t - a.t) * (fa / (fa - fb));
      const fa = a.alt - h0, fb = b.alt - h0;
      if (fa < 0 && fb >= 0 && !ev.rise) ev.rise = lerp(fa, fb);
      if (fa >= 0 && fb < 0 && !ev.set) ev.set = lerp(fa, fb);
      // passage au méridien (angle horaire 0) et « lune sous les pieds » (angle horaire ±180°)
      if (a.H < 0 && b.H >= 0 && b.H - a.H < PI && !ev.transit) ev.transit = lerp(a.H, b.H);

    return ev;
  }
  function solunar(date, lat, lng) {
    const dayStart = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0);
    const sun = dayEvents("sun", dayStart, lat, lng);
    const moon = dayEvents("moon", dayStart, lat, lng);
    const H = 3600000;
    const periods = [];
    if (moon.transit) periods.push({ type: "majeure", label: "Lune au zénith", center: moon.transit, start: moon.transit - H, end: moon.transit + H });
    if (moon.underfoot) periods.push({ type: "majeure", label: "Lune au nadir", center: moon.underfoot, start: moon.underfoot - H, end: moon.underfoot + H });
    if (moon.rise) periods.push({ type: "mineure", label: "Lever de lune", center: moon.rise, start: moon.rise - H / 2, end: moon.rise + H / 2 });
    if (moon.set) periods.push({ type: "mineure", label: "Coucher de lune", center: moon.set, start: moon.set - H / 2, end: moon.set + H / 2 });
    periods.sort((a, b) => a.start - b.start);
    // Note du jour (indicative) : proximité nouvelle/pleine lune + période qui coïncide avec l'aube ou le crépuscule
    const phase = getMoonPhase(new Date(dayStart.getTime() + 12 * H));
    const daysFromSyzygy = Math.min(phase, Math.abs(phase - 0.5), 1 - phase) * 29.53;
    let rating = 1;
    if (daysFromSyzygy <= 1.5) rating += 2; else if (daysFromSyzygy <= 3.5) rating += 1;
    const near = (t) => (sun.rise && Math.abs(t - sun.rise) <= H) || (sun.set && Math.abs(t - sun.set) <= H);
    if (periods.some((p) => near(p.center))) rating += 1;
    return { sun, moon, periods, rating: Math.min(4, rating), illumination: illumination(new Date(dayStart.getTime() + 12 * H)) };
  }
  return { solunar, illumination };
})();

const solunarCache = new Map();
function solunarFor(dateStr, lat, lng) {
  // position arrondie à ~10 km : les heures ne bougent que de quelques secondes, et le cache sert bien plus souvent
  const rl = Math.round(lat * 10) / 10, rg = Math.round(lng * 10) / 10;
  const key = `${dateStr}|${rl}|${rg}`;
  if (solunarCache.has(key)) return solunarCache.get(key);
  const [y, m, d] = dateStr.split("-").map(Number);
  const res = Astro.solunar(new Date(y, m - 1, d), rl, rg);
  if (solunarCache.size > 4000) solunarCache.clear();
  solunarCache.set(key, res);
  return res;
}
function validLatLng(lat, lng) {

}
function getSolunarPosition() {
  try {
    const saved = JSON.parse(localStorage.getItem("fdx_solunar_pos") || "null");
    if (saved && validLatLng(saved.lat, saved.lng)) return { lat: +saved.lat, lng: +saved.lng, label: saved.label || "Ma position", source: "saved" };
  } catch (e) {}
  if (state.activeSession && validLatLng(state.activeSession.lat, state.activeSession.lng)) {
    return { lat: +state.activeSession.lat, lng: +state.activeSession.lng, label: state.activeSession.lieu || "Sortie en cours", source: "auto" };
  }
  let best = null;
  state.sessions.forEach((x) => { if (validLatLng(x.lat, x.lng) && (!best || x.startTs > best.t)) best = { t: x.startTs, lat: +x.lat, lng: +x.lng, label: x.lieu || "Dernière sortie" }; });
  state.catches.forEach((c) => { const t = parseInt(c.id, 10) || 0; if (validLatLng(c.lat, c.lng) && (!best || t > best.t)) best = { t, lat: +c.lat, lng: +c.lng, label: "Dernière prise" }; });

function catchInSolunarPeriod(c, fallbackPos) {
  if (!c.date || !c.heure) return null;

  if (isNaN(hh)) return null;
  const [y, m, d] = c.date.split("-").map(Number);
  if (!y || !m || !d) return null;
  const t = new Date(y, m - 1, d, hh, mm || 0).getTime();
  const pos = catchPosition(c, fallbackPos);
  let found = null;
  for (const off of [-1, 0, 1]) {
    const sol = solunarFor(localDateStr(new Date(y, m - 1, d + off)), pos.lat, pos.lng);

function formatHM(t) { return new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }

}

  const raw = localStorage.getItem(key);
  if (!raw) return [];
  try { const v = JSON.parse(raw); return Array.isArray(v) ? v : []; }
  catch (e) {
    try { if (!localStorage.getItem(key + "_secours")) localStorage.setItem(key + "_secours", raw); } catch (e2) {}

}

/* ---------- photos : IndexedDB (beaucoup plus de place que les ~5 Mo du stockage local) ---------- */
const PhotoDB = (() => {
  let dbPromise = null;
  function open() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        try {
          if (!window.indexedDB) { reject(new Error("indisponible")); return; }
          const req = indexedDB.open("hookdex", 1);

function timeOfDayBucket(heure) {
  if (!heure) return null;
  const h = parseInt(String(heure).split(":")[0], 10);
  if (isNaN(h)) return null;
  if (h >= 5 && h < 11) return "🌅 Matin (5h-11h)";
  if (h >= 11 && h < 14) return "☀️ Midi (11h-14h)";
  if (h >= 14 && h < 18) return "🌤️ Après-midi (14h-18h)";
  return "🌙 Soir / nuit (18h-5h)";
}
function pressureBucket(pression) {
  const p = parseFloat(pression);
  if (isNaN(p)) return null;
  if (p < 1010) return "Basse (< 1010 hPa)";
  if (p <= 1020) return "Moyenne (1010-1020 hPa)";
  return "Haute (> 1020 hPa)";
}
function moonBucketLabel(phase) {
  if (phase < 0.125 || phase >= 0.875) return "🌑 Nouvelle lune";
  if (phase < 0.375) return "🌓 Premier quartier";
  if (phase < 0.625) return "🌕 Pleine lune";
  return "🌗 Dernier quartier";
}
function tallyField(catches, field) {
  const counts = {}, labels = {};
  catches.forEach((c) => {
    const raw = (c[field] || "").trim();
    if (!raw) return;
    const key = normalizeText(raw);
    counts[key] = (counts[key] || 0) + 1;
    if (!labels[key]) labels[key] = raw;
  });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([key, count]) => [labels[key], count]);
  return { top, total };
}
function computeConditionsAnalysis() {
  if (state.catches.length < 5) return null;
  const timeCounts = {}, moonCounts = {}, pressureCounts = {}, meteoWords = {};
  const stopWords = new Set(["avec","sans","tres","assez","plutot","dans","pour","comme"]);
  state.catches.forEach((c) => {
    const tb = timeOfDayBucket(c.heure);
    if (tb) timeCounts[tb] = (timeCounts[tb] || 0) + 1;
    if (c.date) {
      const [y, m, d] = c.date.split("-").map(Number);
      const phase = getMoonPhase(new Date(y, m - 1, d, 12));
      const mb = moonBucketLabel(phase);
      moonCounts[mb] = (moonCounts[mb] || 0) + 1;
    }
    const pb = pressureBucket(c.pression);
    if (pb) pressureCounts[pb] = (pressureCounts[pb] || 0) + 1;
    if (c.meteo) {
      normalizeText(c.meteo).split(/[^a-zàâäéèêëîïôöùûüç]+/).filter((w) => w.length > 3 && !stopWords.has(w))
        .forEach((w) => { meteoWords[w] = (meteoWords[w] || 0) + 1; });
    }
  });
  const sortDesc = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1]);
  return {
    time: sortDesc(timeCounts),
    moon: sortDesc(moonCounts),
    pressure: sortDesc(pressureCounts),
    meteo: sortDesc(meteoWords).slice(0, 4),
    appat: tallyField(state.catches, "appat"),
    leurre: tallyField(state.catches, "leurre"),
    hamecon: tallyField(state.catches, "hameçon"),
    totalWithHeure: Object.values(timeCounts).reduce((a, b) => a + b, 0),
    totalWithDate: state.catches.filter((c) => c.date).length,
    totalWithPression: Object.values(pressureCounts).reduce((a, b) => a + b, 0),
  };
}
function computeStats() {
  if (state.catches.length === 0) return null;
  const countByEspece = {};
  let heaviest = null, longest = null;
  const dates = new Set();
  const byMonth = Array(12).fill(0);
  const bySeason = { hiver:0, printemps:0, ete:0, automne:0 };
  for (const c of state.catches) {
    const qty = parseInt(c.quantite, 10);
    countByEspece[c.especeId] = (countByEspece[c.especeId] || 0) + (qty > 0 ? qty : 1);
    const p = parseFloat(c.poids), t = parseFloat(c.taille);
    if (!isNaN(p) && (!heaviest || p > parseFloat(heaviest.poids))) heaviest = c;
    if (!isNaN(t) && (!longest || t > parseFloat(longest.taille))) longest = c;
    if (c.date) {
      dates.add(c.date);
      const m = new Date(c.date + "T00:00:00").getMonth();
      byMonth[m]++;
      bySeason[seasonOf(m + 1)]++;
    }
  }
  const rankedEspeces = Object.entries(countByEspece).sort((a, b) => b[1] - a[1]);
  const topEntry = rankedEspeces[0];
  return {
    topEspece: topEntry ? { id: topEntry[0], count: topEntry[1] } : null,
    topSpeciesList: rankedEspeces.slice(0, 5).map(([id, count]) => ({ id, count })),
    heaviest, longest, totalPrises: state.catches.length, sorties: dates.size, byMonth, bySeason,

}
function computeStreak() {
  const catchDays = state.catches.map((c) => c.date).filter(Boolean);
  const sessionDays = state.sessions.map((s) => localDateStr(new Date(s.startTs)));
  const activeDay = state.activeSession ? [localDateStr(new Date(state.activeSession.startTs))] : [];
  const days = [...new Set([...catchDays, ...sessionDays, ...activeDay])].sort().reverse();
  if (days.length === 0) return 0;
  let count = 0;
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  const fmt = (d) => localDateStr(d);
  let expected = fmt(cursor);
  if (days[0] !== expected) {
    cursor.setDate(cursor.getDate() - 1);
    expected = fmt(cursor);
    if (days[0] !== expected) return 0;
  }
  for (const d of days) {
    if (d === expected) { count++; cursor.setDate(cursor.getDate() - 1); expected = fmt(cursor); }
    else break;
  }

}

function getRecentLieux() {
  const seen = new Set();

  const sorted = state.sessions.slice().sort((a, b) => b.startTs - a.startTs);
  for (const s of sorted) {
    const lieu = (s.lieu || "").trim();
    if (!lieu) continue;
    const key = normalizeText(lieu);
    if (seen.has(key)) continue;

}

/* ---------- les 7 prochains jours (+ météo si activée) ---------- */
function weatherEnabled() { return localStorage.getItem("fdx_weather_home") === "1"; }
function weatherEmoji(code) {
  if (code === null || code === undefined) return "";
  if (code === 0) return "☀️";
  if (code <= 2) return "🌤️";
  if (code === 3) return "☁️";
  if (code <= 48) return "🌫️";
  if (code <= 57) return "🌦️";
  if (code <= 67) return "🌧️";
  if (code <= 77) return "🌨️";
  if (code <= 82) return "🌦️";
  if (code <= 86) return "🌨️";
  return "⛈️";
}
function loadForecastCache() { try { return JSON.parse(localStorage.getItem("fdx_forecast") || "null"); } catch (e) { return null; } }
function forecastForPosition(pos) {
  if (!weatherEnabled()) return null;
  const c = loadForecastCache();
  if (!c || !c.data || !c.data.daily) return null;
  if (Math.abs(c.lat - pos.lat) > 0.3 || Math.abs(c.lng - pos.lng) > 0.3) return null;
  if (Date.now() - c.ts > 36 * 3600000) return null;
  return { ...c.data, ts: c.ts, stale: Date.now() - c.ts > 3 * 3600000 };
}
let forecastFetching = false, forecastLastTry = 0;
async function refreshForecast(force) {
  if (!weatherEnabled() || forecastFetching || navigator.onLine === false) return;
  if (!force && Date.now() - forecastLastTry < 5 * 60000) return;
  const pos = getSolunarPosition();
  const lat = Math.round(pos.lat * 10) / 10, lng = Math.round(pos.lng * 10) / 10; // position arrondie (~10 km)
  const c = loadForecastCache();
  if (!force && c && Math.abs(c.lat - lat) < 0.05 && Math.abs(c.lng - lng) < 0.05 && Date.now() - c.ts < 3 * 3600000) return;
  forecastFetching = true;
  forecastLastTry = Date.now();
  try {
    const d = await fetchJson(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&timezone=auto&forecast_days=7`
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,wind_direction_10m_dominant"
      + "&hourly=pressure_msl&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl", 12000);
    const pick = (arr, i) => (Array.isArray(arr) && arr[i] !== null && arr[i] !== undefined ? arr[i] : null);
    const daily = {};
    const dd = d && d.daily;
    if (dd && Array.isArray(dd.time)) dd.time.forEach((t, i) => {
      daily[t] = { code: pick(dd.weather_code, i), tmax: pick(dd.temperature_2m_max, i), tmin: pick(dd.temperature_2m_min, i), wind: pick(dd.wind_speed_10m_max, i), dir: pick(dd.wind_direction_10m_dominant, i) };
    });
    let current = null;
    const cur = d && d.current;
    if (cur) {
      let trend = null;
      const h = d.hourly;
      if (h && Array.isArray(h.time) && cur.time && cur.pressure_msl !== null && cur.pressure_msl !== undefined) {
        const idx = h.time.findIndex((t) => String(t).slice(0, 13) === String(cur.time).slice(0, 13));
        const before = idx >= 3 ? pick(h.pressure_msl, idx - 3) : null;
        if (before !== null) trend = cur.pressure_msl - before;
      }
      current = { temp: cur.temperature_2m, code: cur.weather_code, wind: cur.wind_speed_10m, dir: cur.wind_direction_10m, pressure: cur.pressure_msl, trend };
    }
    if (!Object.keys(daily).length) throw new Error("vide");
    localStorage.setItem("fdx_forecast", JSON.stringify({ ts: Date.now(), lat, lng, data: { daily, current } }));
    if (state.tab === "accueil" && !isOverlayOpen()) renderMain();
  } catch (e) { /* hors ligne ou service indisponible : on garde l'éventuelle météo déjà reçue */ }
  finally { forecastFetching = false; }
}

/* ---------- espèces mystères à débloquer ---------- */
function periodMonths(text) {
  const t = normalizeText(text || "");
  if (!t || t.includes("toute l")) return null; // toute l'année (ou inconnu) : pas de restriction
  const re = /\b(printemps|ete|automne|hiver|janv\w*|fev\w*|mars|avr\w*|mai|juin|juil\w*|aout|sept\w*|oct\w*|nov\w*|dec\w*)\b/g;
  const tokens = [];
  let m;
  while ((m = re.exec(t))) tokens.push({ w: m[1], i: m.index });
  if (!tokens.length) return null;
  const SEASON = { printemps: [3, 5], ete: [6, 8], automne: [9, 11], hiver: [12, 2] };
  const MONTHS = [["janv", 1], ["fev", 2], ["mars", 3], ["avr", 4], ["mai", 5], ["juin", 6], ["juil", 7], ["aout", 8], ["sept", 9], ["oct", 10], ["nov", 11], ["dec", 12]];
  const range = (w) => { if (SEASON[w]) return SEASON[w]; const f = MONTHS.find(([k]) => w.startsWith(k)); return f ? [f[1], f[1]] : null; };
  const a = range(tokens[0].w);
  if (!a) return null;
  let from = a[0], to = a[1];
  if (tokens.length >= 2 && /\ba\b/.test(t.slice(tokens[0].i, tokens[1].i))) {
    const b = range(tokens[1].w);
    if (b) to = t.slice(Math.max(0, tokens[1].i - 10), tokens[1].i).includes("debut") ? b[0] : b[1];
  }
  const months = new Set();
  let k = from;
  for (let n = 0; n < 12; n++) { months.add(k); if (k === to) break; k = (k % 12) + 1; }
  return months;
}
function suggestNextSpecies(n) {
  const disc = discoveredIds();
  const month = new Date().getMonth() + 1;
  const catCount = {};
  state.catches.forEach((c) => { const sp = speciesById(c.especeId); if (sp) catCount[sp.categorie] = (catCount[sp.categorie] || 0) + 1; });
  const myCats = Object.keys(catCount);
  const day = Math.floor(Date.now() / 86400000);
  const hash = (id) => { let h = day; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  return SPECIES.filter((sp) => {
    if (disc.has(sp.id)) return false;
    if (myCats.length && !myCats.includes(sp.categorie)) return false;
    const reg = normalizeText(sp.reglementation + " " + sp.periode);
    if (reg.includes("interdit") || reg.includes("protege")) return false;
    const months = periodMonths(sp.periode);
    return !months || months.has(month);
  }).sort((a, b) => (a.difficulte - b.difficulte) || ((catCount[b.categorie] || 0) - (catCount[a.categorie] || 0)) || (hash(a.id) - hash(b.id))).slice(0, n);
}
function renderMysterySpecies() {
  const list = suggestNextSpecies(3);
  if (!list.length) return "";
  return `
    <div class="section-title">🎯 Prochaines découvertes</div>
    <div class="card" style="padding:4px 14px;">
      ${list.map((sp) => {
        const meta = catMeta(sp.categorie);
        const hab = sp.habitat.length > 46 ? sp.habitat.slice(0, 45) + "…" : sp.habitat;
        return `<button class="mystery-row" data-open-species="${sp.id}">
          <span class="ico" style="background:${meta.color}33;">🔒</span>
          <span style="flex:1; min-width:0;">

            <span style="display:block; font-size:12px; color:var(--muted); margin-top:2px;">${escapeHtml(hab)} · <span class="mono">${"★".repeat(sp.difficulte)}${"☆".repeat(5 - sp.difficulte)}</span></span>
          </span>
          <span style="color:var(--muted);">›</span>
        </button>`;
      }).join("")}
      <div style="font-size:11px; color:var(--muted); padding:4px 0 8px;">Des espèces faciles de tes milieux, de saison en ce moment. Touche pour voir les indices.</div>
    </div>`;
}

/* ---------- nom du fichier sur GitHub + anciennes adresses ---------- */
function pageFileName() {
  try { const parts = decodeURIComponent(location.pathname).split("/"); return parts[parts.length - 1]; } catch (e) { return ""; }
}
function isCanonicalPage() { const f = pageFileName(); return f === "" || f === "index.html"; }
function isHostedSite() { return /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); }
let addressWarning = null; // null | "rename" | "old-url"
function checkPageAddress() {
  if (!isHostedSite()) return;
  if (isCanonicalPage()) { redirectOldCachedPages(); return; }
  fetch("./index.html", { method: "HEAD", cache: "no-store" }).then((r) => {
    addressWarning = r.ok ? "old-url" : "rename";
    if (state.tab === "accueil" && !isOverlayOpen()) renderMain();
  }).catch(() => {});
}
// Les anciennes adresses (ex. « index (3).html ») gardées en cache renvoient désormais vers index.html
async function redirectOldCachedPages() {
  if (!window.caches) return;
  try {
    const stub = '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HookDex France</title><script>location.replace("./index.html")<\/script><a href="./index.html">Ouvrir HookDex</a>';
    for (const key of await caches.keys()) {
      const cache = await caches.open(key);
      for (const req of await cache.keys()) {
        const u = new URL(req.url);
        if (u.origin !== location.origin) continue;
        let file = "";
        try { file = decodeURIComponent(u.pathname.split("/").pop()); } catch (e) {}
        if (/^index.+\.html$/i.test(file)) await cache.put(req, new Response(stub, { headers: { "Content-Type": "text/html; charset=utf-8" } }));
      }
    }
  } catch (e) {}
}
function renderAddressWarning() {
  if (!addressWarning) return "";
  const name = escapeHtml(pageFileName());
  if (addressWarning === "rename") return `
    <div class="card backup-card">
      <b style="color:var(--accent);">⚠️ Un seul réglage à faire sur GitHub</b><br>
      Ce fichier s'appelle « ${name} » sur ton site. Renomme-le exactement <b>index.html</b>, sinon l'icône HookDex de ton écran d'accueil ne s'ouvrira pas.<br>
      <span style="color:var(--muted);">Sur GitHub : touche le fichier → ✏️ → change le nom tout en haut → « Commit changes ».</span>
    </div>`;
  return `
    <div class="card backup-card">
      <b style="color:var(--accent);">⚠️ Tu utilises une ancienne adresse</b><br>
      « ${name} » n'est plus la bonne page. Tes prises sont aussi sur la bonne adresse (c'est le même site).
      <div class="btn-row"><button class="small-btn" id="btn-go-canonical" style="color:var(--accent); border-color:var(--accent);">Ouvrir la bonne adresse</button></div>
    </div>`;
}
async function updateAppStatus() {
  if (!document.getElementById("app-status")) return;
  const standalone = !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  const offline = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  let persisted = null;
  try { if (navigator.storage && navigator.storage.persisted) persisted = await navigator.storage.persisted(); } catch (e) {}
  const nameOk = !isHostedSite() || isCanonicalPage();
  const rows = [
    ["Version", APP_VERSION, true],
    ["Fonctionne hors connexion", offline ? "oui" : "pas encore (rouvre l'app)", offline],
    ["Installée sur l'écran d'accueil", standalone ? "oui" : "non", null],
    ...(persisted === null ? [] : [["Données protégées du nettoyage auto", persisted ? "oui" : "non", persisted ? true : null]]),
    ["Nom du fichier sur le site", nameOk ? "index.html ✓" : `« ${pageFileName()} » : à renommer en index.html`, nameOk],
  ];
  const el = document.getElementById("app-status");
  if (!el) return;
  el.innerHTML = rows.map(([k, v, ok]) => `<div style="display:flex; justify-content:space-between; gap:12px; padding:3px 0;"><span>${k}</span><span style="text-align:right; color:${ok === false ? "#E08A6B" : "var(--text)"};">${escapeHtml(v)}</span></div>`).join("");
}
function lastBackupDays() {
  const last = parseInt(localStorage.getItem("fdx_last_backup") || "0", 10);
  return last ? Math.floor((Date.now() - last) / 86400000) : null;
}
function lastBackupLabel() {
  const d = lastBackupDays();
  if (d === null) return "jamais";
  if (d === 0) return "aujourd'hui";
  if (d === 1) return "hier";
  return `il y a ${d} jours`;
}
function renderBackupReminder() {
  if (state.catches.length < 3) return "";
  const days = lastBackupDays();
  if (days !== null && days < 30) return "";
  if (Date.now() < parseInt(localStorage.getItem("fdx_backup_snooze") || "0", 10)) return "";
  return `
    <div class="card backup-card">

function progressRing(pct) {
  const r = 30, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return `
    <svg width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--track)" stroke-width="7"></circle>
      <circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--accent)" stroke-width="7" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 36 36)"></circle>
      <text x="36" y="41" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="var(--accent)" font-weight="600">${pct}%</text>
    </svg>`;
}

/* ---------- écran DEX ---------- */
function filteredSpecies() {
  const disc = discoveredIds();
  return SPECIES.filter((s) => {
    if (state.dexStatus === "decouvertes" && !disc.has(s.id)) return false;
    if (state.dexStatus === "a_decouvrir" && disc.has(s.id)) return false;
    if (state.dexFilter !== "toutes" && s.categorie !== state.dexFilter) return false;
    if (!state.search.trim()) return true;
    const q = normalizeText(state.search);
    return normalizeText(s.nom).includes(q) || normalizeText(s.latin).includes(q) || normalizeText(s.famille).includes(q)
      || normalizeText(s.habitat).includes(q) || normalizeText(s.repartition).includes(q);
  });
}
function renderDex() {
  const disc = discoveredIds();
  const countInCat = (catId) => SPECIES.filter((s) => s.categorie === catId).length;
  const discInCat = (catId) => SPECIES.filter((s) => s.categorie === catId && disc.has(s.id)).length;
  return `
    <div class="search-bar">

const DEX_ICONS = { crustaces: "🦀", cephalopodes: "🐙", coquillages: "🐚" };

  return normalizeText(haystack).includes(q);
}

  return items.map((item) => (item.type === "session" ? renderSessionGroup(item) : renderCatchCard(item.catch))).join("");
}
function buildJournalGroups() {
  const bySession = {};
  const standalone = [];
  state.catches.forEach((c) => {
    if (c.sessionId) { (bySession[c.sessionId] = bySession[c.sessionId] || []).push(c); }
    else { standalone.push(c); }
  });
  const items = [];
  const handledSessionIds = new Set();
  Object.entries(bySession).forEach(([sid, catches]) => {
    const saved = state.sessions.find((s) => s.id === sid);
    const active = !!(state.activeSession && state.activeSession.id === sid);
    const startTs = saved ? saved.startTs : active ? state.activeSession.startTs : parseInt(sid, 10) || 0;
    items.push({
      type: "session",
      sortTs: startTs,
      meta: { id: sid, startTs, lieu: saved ? saved.lieu : (active ? state.activeSession.lieu : ""), dureeMinutes: saved ? saved.dureeMinutes : null, active },
      catches: catches.slice().sort((a, b) => (parseInt(b.id, 10) || 0) - (parseInt(a.id, 10) || 0)),
    });
    handledSessionIds.add(sid);
  });
  // Sorties terminées sans aucune prise : on les affiche quand même (vides), pour pouvoir les supprimer
  state.sessions.forEach((s) => {
    if (handledSessionIds.has(s.id)) return;
    items.push({
      type: "session",
      sortTs: s.startTs,
      meta: { id: s.id, startTs: s.startTs, lieu: s.lieu, dureeMinutes: s.dureeMinutes, active: false },
      catches: [],
    });
  });
  standalone.forEach((c) => items.push({ type: "single", sortTs: parseInt(c.id, 10) || 0, catch: c }));
  items.sort((a, b) => b.sortTs - a.sortTs);
  return items;
}
function renderSessionGroup(item) {
  const { meta, catches } = item;
  const dateLabel = formatDate(localDateStr(new Date(meta.startTs)));

      </div>

    </div>`;
}

function renderHourChart() {
  const byHour = new Array(24).fill(0);
  let n = 0;
  state.catches.forEach((c) => {
    if (!c.heure) return;
    const h = parseInt(String(c.heure).split(":")[0], 10);
    if (isNaN(h) || h < 0 || h > 23) return;
    const q = parseInt(c.quantite, 10);
    byHour[h] += q > 0 ? q : 1;
    n++;
  });
  if (n < 3) return "";
  const max = Math.max(...byHour);
  const best = byHour.indexOf(max);
  const bars = byHour.map((v, h) => `
    <div class="bar-col"><div class="bar" style="height:${Math.max((v / max) * 100, v > 0 ? 4 : 0)}%;${h === best ? "" : " opacity:0.7;"}" title="${h}h : ${v}"></div><div class="bar-label">${h % 3 === 0 ? h + "h" : ""}</div></div>`).join("");
  return `
    <div class="section-title">🕐 Heures de tes prises</div>
    <div class="card"><div class="bar-chart" style="gap:2px; height:110px;">${bars}</div>
      <div style="font-size:12px; color:var(--muted); margin-top:8px;">Ton créneau le plus productif : <b style="color:var(--accent);">${best}h–${(best + 1) % 24}h</b> (${max} prise${max > 1 ? "s" : ""})</div>
    </div>`;
}
function renderStatsExtras() {
  let html = "";
  // Efficacité des sorties chronométrées
  const finished = state.sessions.filter((x) => x.dureeMinutes > 0);
  const finishedIds = new Set(finished.map((x) => x.id));
  const inFinished = state.catches.filter((c) => c.sessionId && finishedIds.has(c.sessionId));
  const hours = finished.reduce((sum, x) => sum + x.dureeMinutes, 0) / 60;
  const released = state.catches.filter((c) => c.relachee).length;
  const fishCount = state.catches.filter((c) => { const sp = speciesById(c.especeId); return !sp || !HAND_GATHERED_CATEGORIES.includes(sp.categorie); }).length;
  const tiles = [];
  if (hours >= 0.5 && inFinished.length > 0) tiles.push(`<div class="card mini-stat"><div class="icon">⚡</div><div class="value">${(inFinished.length / hours).toFixed(1).replace(".", ",")}</div><div class="label">Prises / heure en sortie</div></div>`);
  if (fishCount > 0) tiles.push(`<div class="card mini-stat"><div class="icon">♻️</div><div class="value">${Math.round((released / fishCount) * 100)} %</div><div class="label">Remis à l'eau (${released})</div></div>`);
  if (tiles.length) html += `<div class="section-title">🎯 Efficacité</div><div class="stats-grid" style="grid-template-columns:${tiles.length > 1 ? "1fr 1fr" : "1fr"};">${tiles.join("")}</div>`;
  const best = finished.map((x) => ({ x, n: state.catches.filter((c) => c.sessionId === x.id).length })).sort((a, b) => b.n - a.n)[0];
  if (best && best.n > 1) {
    html += `<div class="card" style="margin-top:10px; font-size:13px;">🏅 Meilleure sortie : <b>${best.n} prises</b> le ${formatDate(localDateStr(new Date(best.x.startTs)))}${best.x.lieu ? " à " + escapeHtml(best.x.lieu) : ""} (${formatDurationShort(best.x.dureeMinutes)})</div>`;
  }
  // Records personnels par espèce
  const rec = {};
  state.catches.forEach((c) => {
    const r = rec[c.especeId] || (rec[c.especeId] = { n: 0, t: 0, p: 0 });
    const q = parseInt(c.quantite, 10);
    r.n += q > 0 ? q : 1;
    const t = parseFloat(c.taille), p = parseFloat(c.poids);
    if (!isNaN(t) && t > r.t) r.t = t;
    if (!isNaN(p) && p > r.p) r.p = p;
  });
  const recList = Object.entries(rec).filter(([, r]) => r.t > 0 || r.p > 0).sort((a, b) => b[1].n - a[1].n).slice(0, 10);
  if (recList.length) {
    html += `<div class="section-title">🏅 Records personnels</div><div class="card" style="padding:6px 14px;">
      ${recList.map(([id, r], i) => `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; ${i > 0 ? "border-top:1px solid var(--border);" : ""}">
          <span style="font-size:13.5px;">${escapeHtml(speciesName(id))} <span style="color:var(--muted); font-size:11.5px;">×${r.n}</span></span>
          <span class="mono" style="font-size:12.5px; color:var(--accent); text-align:right;">${r.t > 0 ? r.t + " cm" : ""}${r.t > 0 && r.p > 0 ? " · " : ""}${r.p > 0 ? String(r.p).replace(".", ",") + " kg" : ""}</span>
        </div>`).join("")}
    </div>`;
  }
  // Test perso de la théorie solunaire
  const pos = getSolunarPosition();
  const timed = state.catches.filter((c) => c.date && c.heure);
  if (timed.length >= 5) {
    let major = 0, minor = 0;
    timed.forEach((c) => { const r = catchInSolunarPeriod(c, pos); if (r === "majeure") major++; else if (r === "mineure") minor++; });
    const pct = Math.round(((major + minor) / timed.length) * 100);
    const verdict = pct >= 35 ? "Tes prises semblent suivre la lune 🌙" : pct <= 15 ? "La lune ne semble pas jouer pour toi" : "Pas d'effet net pour l'instant";
    html += `<div class="section-title">🌙 Tes prises et la lune</div>
      <div class="card" style="font-size:13px; line-height:1.55;">
        <b style="color:var(--accent);">${pct} %</b> de tes prises (${major + minor} sur ${timed.length}) ont eu lieu pendant une période solunaire
        (${major} majeure${major > 1 ? "s" : ""}, ${minor} mineure${minor > 1 ? "s" : ""}), alors que ces périodes ne couvrent qu'environ <b>25 %</b> de la journée.
        <div style="margin-top:6px; color:var(--muted); font-size:12px;">${verdict}${timed.length < 20 ? " (à confirmer avec plus de prises)" : ""}.</div>
      </div>`;
  }
  return html;
}

/* ---------- écran CARTE ---------- */
function renderCalendrier() {
  const year = state.calendarYear, month = state.calendarMonth;
  const firstDay = new Date(year, month, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = localDateStr(new Date());

  const catchesByDate = {};
  state.catches.forEach((c) => { if (c.date) (catchesByDate[c.date] = catchesByDate[c.date] || []).push(c); });
  const sessionsByDate = {};
  state.sessions.forEach((s) => { const d = localDateStr(new Date(s.startTs)); (sessionsByDate[d] = sessionsByDate[d] || []).push(s); });
  if (state.activeSession) { const d = localDateStr(new Date(state.activeSession.startTs)); (sessionsByDate[d] = sessionsByDate[d] || []).push(state.activeSession); }

  const solPos = getSolunarPosition();
  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<button class="cal-day empty" disabled></button>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const phase = getMoonPhase(new Date(year, month, day, 12));
    const emoji = moonPhaseEmoji(phase);
    const hasActivity = !!catchesByDate[dateStr] || !!sessionsByDate[dateStr];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === state.calendarSelectedDate;
    const goodDay = solunarFor(dateStr, solPos.lat, solPos.lng).rating >= 3;
    cells += `
      <button class="cal-day ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}" data-cal-date="${dateStr}" aria-label="${formatDate(dateStr)}${hasActivity ? ", activité enregistrée" : ""}">
        ${goodDay ? `<span class="cal-star" aria-hidden="true">★</span>` : ""}
        <span class="cal-moon">${emoji}</span>
        <span>${day}</span>
        ${hasActivity ? `<span class="cal-dot"></span>` : ""}
      </button>`;
  }

  const selected = state.calendarSelectedDate;
  let detailHtml = "";
  if (selected) {
    const [sy, sm, sd] = selected.split("-").map(Number);
    const phase = getMoonPhase(new Date(sy, sm - 1, sd, 12));
    const selSol = solunarFor(selected, solPos.lat, solPos.lng);
    const catches = catchesByDate[selected] || [];
    const sessions = sessionsByDate[selected] || [];
    detailHtml = `
      <div class="cal-detail card">
        <div class="oswald" style="font-size:16px;">${formatDate(selected)}</div>
        <div style="font-size:13px; color:var(--muted); margin-top:4px;">${moonPhaseEmoji(phase)} ${moonPhaseLabel(phase)} · ${Math.round(selSol.illumination * 100)} % éclairée</div>
        <div style="font-size:12.5px; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span>☀️ ${selSol.sun.rise ? formatHM(selSol.sun.rise) : "–"} → ${selSol.sun.set ? formatHM(selSol.sun.set) : "–"}</span>
          <span>${ratingDots(selSol.rating)} ${RATING_LABELS[selSol.rating]}</span>
        </div>
        ${(() => {
          const fc = forecastForPosition(solPos);
          const w = fc && fc.daily[selected];
          return w && w.tmax !== null ? `<div style="font-size:12.5px; color:var(--muted); margin-top:4px;">${weatherEmoji(w.code)} Prévu : ${w.tmin !== null ? Math.round(w.tmin) + "–" : ""}${Math.round(w.tmax)}°C${w.wind !== null ? ` · vent jusqu'à ${Math.round(w.wind)} km/h${w.dir !== null ? " " + windDirFr(w.dir) : ""}` : ""}</div>` : "";
        })()}
        ${solunarTimeline(selSol, new Date(sy, sm - 1, sd).getTime(), selected === todayStr)}
        ${solunarPeriodsList(selSol)}
        ${sessions.length ? `<div style="font-size:12.5px; color:var(--accent); margin-top:8px;">🎣 ${sessions.length} sortie${sessions.length > 1 ? "s" : ""} ce jour-là</div>` : ""}
        ${catches.length ? `
          <div class="section-title" style="margin-top:12px;">🐟 ${catches.length} prise${catches.length > 1 ? "s" : ""}</div>
          ${catches.map((c) => `<div style="font-size:12.5px; color:var(--text); margin-bottom:4px;">${escapeHtml(speciesName(c.especeId))}${c.taille ? " · " + escapeHtml(c.taille) + "cm" : ""}${c.poids ? " · " + escapeHtml(c.poids) + "kg" : ""}</div>`).join("")}
        ` : `<div style="font-size:12.5px; color:var(--muted); margin-top:8px;">Aucune prise enregistrée ce jour-là.</div>`}
      </div>`;
  }

  return `
    <div class="cal-header">
      <button class="cal-nav-btn" id="cal-prev" aria-label="Mois précédent">‹</button>
      <div class="oswald" style="font-size:17px;">${MONTH_NAMES_FULL[month]} ${year}</div>
      <button class="cal-nav-btn" id="cal-next" aria-label="Mois suivant">›</button>
    </div>
    <div class="cal-grid">
      ${WEEKDAY_LABELS.map((w) => `<div class="cal-weekday">${w}</div>`).join("")}
      ${cells}
    </div>
    ${detailHtml}
    <div style="font-size:11px; color:var(--muted); margin-top:14px; line-height:1.5;">
      🌑🌒🌓🌔🌕🌖🌗🌘 Phases lunaires et heures du soleil calculées hors ligne. Le point orange indique une prise ou une sortie ce jour-là, l'étoile ★ une journée favorable.<br>
      Périodes solunaires : <b>majeures</b> (lune au zénith ou au nadir, 2 h) et <b>mineures</b> (lever et coucher de lune, 1 h), calculées pour : ${escapeHtml(solPos.label)}. Théorie indicative, à confronter à tes propres stats.
    </div>
  `;
}

function renderCarte() {
  const catchSpots = state.catches.filter((c) => c.lat && c.lng).map((c) => ({ type: "catch", lat: c.lat, lng: c.lng, date: c.date, data: c }));
  const sessionList = [...state.sessions, ...(state.activeSession ? [state.activeSession] : [])];
  const sessionSpots = sessionList.filter((s) => s.lat && s.lng).map((s) => ({ type: "session", lat: s.lat, lng: s.lng, date: localDateStr(new Date(s.startTs)), data: s }));
  const spots = [...catchSpots, ...sessionSpots];
  if (spots.length === 0) {
    return `<div class="empty-hint">Aucun spot enregistré pour l'instant. Active la position GPS quand tu ajoutes une prise ou une sortie pour la voir apparaître ici.</div>`;
  }
  return `
    <div class="section-title">🗺️ ${spots.length} spot${spots.length > 1 ? "s" : ""} géolocalisé${spots.length > 1 ? "s" : ""}</div>
    <div id="map-zone">
      <div id="leaflet-map"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; font-size:11.5px; color:var(--muted);">
        <span>● prise (couleur = milieu) · ◯ sortie</span>
        <button class="small-btn" id="map-locate" style="padding:6px 10px;">📍 Ma position</button>

      <div id="map-status" style="font-size:11.5px; color:var(--muted); margin-top:8px; text-align:center;">Chargement de la carte…</div>
    </div>
    <div class="section-title" style="margin-top:22px;">📍 Liste des spots</div>
    <div>
      ${spots.map((spot) => {
        if (spot.type === "catch") {
          const c = spot.data;
          const sp = speciesById(c.especeId);
          return `
          <div class="card map-fallback-item" style="margin-bottom:8px;">
            <div>
              <div class="oswald" style="font-size:14.5px;">${escapeHtml(sp ? sp.nom : c.especeId)}</div>
              <div style="font-size:11.5px; color:var(--muted);">${formatDate(c.date)}${c.taille ? " · " + escapeHtml(c.taille) + "cm" : ""}</div>
            </div>
            <a href="https://www.google.com/maps?q=${c.lat},${c.lng}" target="_blank" rel="noopener noreferrer">Ouvrir dans Maps ↗</a>
          </div>`;
        }
        const s = spot.data;
        return `
        <div class="card map-fallback-item" style="margin-bottom:8px; border-color:var(--accent);">
          <div>
            <div class="oswald" style="font-size:14.5px;">🎣 ${escapeHtml(s.lieu || "Sortie")}</div>
            <div style="font-size:11.5px; color:var(--muted);">${formatDate(spot.date)}${s.dureeMinutes ? " · " + formatDurationShort(s.dureeMinutes) : " · en cours"}</div>
          </div>
          <a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener noreferrer">Ouvrir dans Maps ↗</a>
        </div>`;
      }).join("")}
    </div>
  `;
}
let fdxLeafletMap = null;
function loadLeaflet(onReady, onError) {
  if (window.L) { onReady(); return; }
  if (!document.getElementById("leaflet-css")) {
    const link = document.createElement("link");
    link.id = "leaflet-css"; link.rel = "stylesheet";
    link.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(link);
  }
  const script = document.createElement("script");
  script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  script.onload = onReady;
  script.onerror = onError;
  document.head.appendChild(script);
}
function setupCarteTab() {
  const mapDiv = document.getElementById("leaflet-map");
  if (!mapDiv) return;
  const statusEl = document.getElementById("map-status");
  loadLeaflet(
    () => {
      if (!document.getElementById("leaflet-map")) return; // l'utilisateur a changé d'onglet entre temps
      if (fdxLeafletMap) { fdxLeafletMap.remove(); fdxLeafletMap = null; }
      const withGps = state.catches.filter((c) => validLatLng(c.lat, c.lng));
      const sessionList = [...state.sessions, ...(state.activeSession ? [state.activeSession] : [])];
      const sessionsWithGps = sessionList.filter((s) => validLatLng(s.lat, s.lng));
      const accent = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#FF5A36";
      const map = L.map("leaflet-map");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap", maxZoom: 18,
      }).addTo(map);
      const bounds = [];
      withGps.forEach((c) => {
        const sp = speciesById(c.especeId);
        const lat = parseFloat(c.lat), lng = parseFloat(c.lng);
        L.circleMarker([lat, lng], { radius: 8, color: "#FFFFFF", weight: 2, fillColor: sp ? catMeta(sp.categorie).color : accent, fillOpacity: 0.95 }).addTo(map).bindPopup(
          `<b>${escapeHtml(sp ? sp.nom : c.especeId)}</b><br>${formatDate(c.date)}${c.heure ? " · " + escapeHtml(c.heure) : ""}${c.taille ? " · " + escapeHtml(c.taille) + "cm" : ""}${c.poids ? " · " + escapeHtml(c.poids) + "kg" : ""}`
        );
        bounds.push([lat, lng]);
      });
      sessionsWithGps.forEach((s) => {
        const lat = parseFloat(s.lat), lng = parseFloat(s.lng);
        const dateStr = localDateStr(new Date(s.startTs));
        const n = state.catches.filter((c) => c.sessionId === s.id).length;
        L.circleMarker([lat, lng], { radius: 11, color: accent, weight: 3, fillColor: accent, fillOpacity: 0.15 }).addTo(map).bindPopup(
          `<b>🎣 ${escapeHtml(s.lieu || "Sortie")}</b><br>${formatDate(dateStr)} · ${n} prise${n > 1 ? "s" : ""}${s.dureeMinutes ? " · " + formatDurationShort(s.dureeMinutes) : " · en cours"}`
        );
        bounds.push([lat, lng]);
      });
      if (bounds.length === 0) map.setView([46.6, 2.4], 5);
      else if (bounds.length === 1) map.setView(bounds[0], 12);
      else map.fitBounds(bounds, { padding: [30, 30] });
      const locateBtn = document.getElementById("map-locate");
      if (locateBtn) locateBtn.onclick = () => {
        if (!navigator.geolocation) return;
        locateBtn.textContent = "📍 Localisation…";
        navigator.geolocation.getCurrentPosition((p) => {
          const ll = [p.coords.latitude, p.coords.longitude];
          L.circleMarker(ll, { radius: 7, color: "#FFFFFF", weight: 3, fillColor: "#2E7DF6", fillOpacity: 1 }).addTo(map).bindPopup("Tu es ici");
          map.setView(ll, 13);
          locateBtn.textContent = "📍 Ma position";
        }, () => { locateBtn.textContent = "📍 Position indisponible"; }, { timeout: 10000, maximumAge: 60000 });
      };
      fdxLeafletMap = map;
      if (statusEl) statusEl.remove();
    },
    () => {
      if (statusEl) statusEl.innerHTML = "Impossible de charger la carte (connexion internet requise pour cet écran). La liste ci-dessous reste disponible hors ligne.";
    }
  );
}

function attachSettingsHandlers() {
  const overlay = document.getElementById("settings-overlay");
  const close = () => { state.showSettings = false; render(); };
  if (overlay) overlay.onclick = (e) => { if (e.target === overlay) close(); };
  const closeBtn = document.getElementById("settings-close");
  if (closeBtn) closeBtn.onclick = close;
  const darkBtn = document.getElementById("set-theme-dark");
  if (darkBtn) darkBtn.onclick = () => { state.theme = "dark"; saveTheme("dark"); render(); };
  const lightBtn = document.getElementById("set-theme-light");
  if (lightBtn) lightBtn.onclick = () => { state.theme = "light"; saveTheme("light"); render(); };
  const autoBtn = document.getElementById("set-theme-auto");
  if (autoBtn) autoBtn.onclick = () => { state.theme = "auto"; saveTheme("auto"); render(); };
  const exportBtn = document.getElementById("set-export");
  if (exportBtn) exportBtn.onclick = exportData;
  const exportCsvBtnSettings = document.getElementById("set-export-csv");
  if (exportCsvBtnSettings) exportCsvBtnSettings.onclick = exportDataCsv;
  const importInput = document.getElementById("set-import");
  if (importInput) importInput.onchange = importData;
  const shareBackupBtn = document.getElementById("set-share-backup");
  if (shareBackupBtn) shareBackupBtn.onclick = shareBackup;
  const solHere = document.getElementById("set-solunar-here");
  if (solHere) solHere.onclick = () => setSolunarPositionFromGps(() => render());
  const solAuto = document.getElementById("set-solunar-auto");
  if (solAuto) solAuto.onclick = () => { localStorage.removeItem("fdx_solunar_pos"); render(); };
  updateStorageCard();
  updateAppStatus();
  const weatherToggle = document.getElementById("set-weather-toggle");
  if (weatherToggle) weatherToggle.onclick = () => {
    if (weatherEnabled()) { localStorage.removeItem("fdx_weather_home"); localStorage.removeItem("fdx_forecast"); }
    else { localStorage.setItem("fdx_weather_home", "1"); refreshForecast(true); }
    render();
  };
  const clearBtn = document.getElementById("set-clear");
  if (clearBtn) clearBtn.onclick = () => {
    if (confirm(`Effacer définitivement tes ${state.catches.length} prise(s) enregistrée(s) et leurs photos ? Cette action est irréversible. Pense à télécharger une sauvegarde avant.`)) {
      state.catches = [];
      saveCatches(state.catches);
      PhotoDB.clear().catch(() => {});
      photoCache.clear();
      render();
      checkNewAchievements();
    }
  };
}

          ${myCatches.length ? `

          ` : ""}
        `}
        <button class="primary-btn" id="modal-add-catch" data-species="${s.id}" style="margin-top:18px;">➕ ${caught ? "Nouvelle prise de cette espèce" : "J'en ai pris un !"}</button>

    </div>
  `;
}

function filterEspeceOptions(query) {
  const select = document.getElementById("f-espece");
  if (!select) return;
  const q = normalizeText(query.trim());
  Array.from(select.querySelectorAll("optgroup")).forEach((group) => {
    let anyVisible = false;
    Array.from(group.querySelectorAll("option")).forEach((opt) => {
      const match = !q || normalizeText(opt.textContent).includes(q);
      opt.hidden = !match;
      if (match) anyVisible = true;
    });
    group.hidden = !anyVisible;
  });
}
const HAND_GATHERED_CATEGORIES = ["coquillages"];
const BULK_CATEGORIES = ["coquillages", "crustaces"];
function updateFormFieldsVisibility(especeId) {
  const sp = speciesById(especeId);
  const categorie = sp ? sp.categorie : null;
  const gearWrap = document.getElementById("gear-fields-wrap");
  const qtyWrap = document.getElementById("qty-field-wrap");
  if (gearWrap) gearWrap.style.display = categorie && HAND_GATHERED_CATEGORIES.includes(categorie) ? "none" : "";
  if (qtyWrap) qtyWrap.style.display = categorie && BULK_CATEGORIES.includes(categorie) ? "" : "none";
  const relacheeLabel = document.getElementById("relachee-label");
  if (relacheeLabel) relacheeLabel.textContent = sp ? `${sp.nom} relâché(e) (no-kill)` : "Relâché(e) (no-kill)";
  updateRegHint();
}
function legalMinSize(sp) {
  const m = sp && /^Taille (?:minimale|légale)( conseillée)? (\d+(?:[.,]\d+)?) ?cm$/i.exec(sp.reglementation || "");
  return m ? { cm: parseFloat(m[2].replace(",", ".")), advisory: !!m[1] } : null;
}
function updateRegHint() {
  const el = document.getElementById("reg-hint");
  if (!el) return;
  const sp = speciesById((document.getElementById("f-espece") || {}).value);
  if (!sp) { el.innerHTML = ""; return; }
  const r = categorizeRegulation(sp.reglementation);
  const reg = normalizeText(sp.reglementation);
  const min = legalMinSize(sp);
  const taille = parseFloat(String((document.getElementById("f-taille") || {}).value || "").replace(",", "."));
  const released = !!(document.getElementById("f-relachee") || {}).checked;
  let warn = "";
  if ((reg.includes("interdit") && !reg.includes("relacher")) || reg.includes("protege")) {
    if (!released) warn = "⚠️ Espèce protégée : à remettre à l'eau immédiatement.";
  } else if (released && (reg.includes("invasive") || reg.includes("ne peut etre relache") || reg.includes("interdiction de relacher"))) {
    warn = "⚠️ Cette espèce ne doit pas être relâchée.";
  } else if (min && taille > 0 && taille < min.cm && !released) {
    warn = `⚠️ ${taille} cm : sous la taille ${min.advisory ? "conseillée" : "minimale"} de ${min.cm} cm, à remettre à l'eau.`;
  }
  el.innerHTML = r.label === "Pêchable" && !warn ? "" :
    `<span style="color:${r.color}; font-weight:600;">${r.emoji} ${escapeHtml(sp.reglementation)}</span> <span style="color:var(--muted);">(indicatif)</span>${warn ? `<br><span style="color:#E08A6B; font-weight:600;">${warn}</span>` : ""}`;
}

function handlePhotoInput(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const errEl = document.getElementById("form-error");
  if (errEl) errEl.textContent = "Compression de la photo…";
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxDim = photoDbReady ? 1600 : 1080;
      let width = img.width, height = img.height;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      const compressed = canvas.toDataURL("image/jpeg", photoDbReady ? 0.8 : 0.68);
      state.photoData = compressed;
      state.photoDirty = true;
      const preview = document.getElementById("photo-preview");
      if (preview) preview.innerHTML = photoPreviewHtml(compressed);
      attachPhotoRemove();
      if (errEl) errEl.textContent = "";
    };
    img.onerror = () => { if (errEl) errEl.textContent = "Impossible de lire cette image."; };
    img.src = reader.result;
  };
  reader.onerror = () => { if (errEl) errEl.textContent = "Erreur de lecture du fichier."; };
  reader.readAsDataURL(file);
}

function importData(e) {
  const input = e.target;
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (err) { alert("Fichier invalide : ce n'est pas une sauvegarde HookDex."); return; }
    let importedCatches = [], importedSessions = [];
    if (Array.isArray(data)) importedCatches = data; // ancien format d'export (juste un tableau de prises)
    else if (data && typeof data === "object") {
      importedCatches = Array.isArray(data.catches) ? data.catches : [];
      importedSessions = Array.isArray(data.sessions) ? data.sessions : [];
    } else { alert("Fichier invalide."); return; }
    const existingIds = new Set(state.catches.map((c) => String(c.id)));
    let newCatches = importedCatches.filter((c) => c && c.id && !existingIds.has(String(c.id))).map((c) => ({ ...c, id: String(c.id) }));
    const skippedCatches = importedCatches.length - newCatches.length;
    const existingSessionIds = new Set(state.sessions.map((s) => s.id));
    const newSessions = importedSessions.filter((s) => s && s.id && !existingSessionIds.has(s.id));
    try { newCatches = stripMovedPhotos(newCatches, await movePhotosToDb(newCatches)); } catch (err) {}
    const prevCatches = state.catches, prevSessions = state.sessions;
    state.catches = [...newCatches, ...state.catches];
    state.sessions = [...newSessions, ...state.sessions];
    if (!saveCatches(state.catches)) { state.catches = prevCatches; state.sessions = prevSessions; return; }
    saveSessions(state.sessions);
    render();
    checkNewAchievements();
    const parts = [`${newCatches.length} prise(s) importée(s)${skippedCatches > 0 ? `, ${skippedCatches} ignorée(s) (déjà présentes)` : ""}`];
    if (importedSessions.length > 0) parts.push(`${newSessions.length} sortie(s) importée(s)`);
    alert(parts.join(" · "));
  };
  reader.onerror = () => alert("Impossible de lire ce fichier.");
  reader.readAsText(file);
  input.value = "";
}

/* ---------- météo automatique (Open-Meteo : gratuit, sans compte) ---------- */
const WMO_FR = { 0: "Ciel dégagé", 1: "Plutôt dégagé", 2: "Partiellement nuageux", 3: "Couvert", 45: "Brouillard", 48: "Brouillard givrant",
  51: "Bruine légère", 53: "Bruine", 55: "Bruine dense", 56: "Bruine verglaçante", 57: "Bruine verglaçante", 61: "Pluie faible", 63: "Pluie modérée",
  65: "Pluie forte", 66: "Pluie verglaçante", 67: "Pluie verglaçante", 71: "Neige faible", 73: "Neige", 75: "Neige forte", 77: "Grésil",
  80: "Averses", 81: "Averses", 82: "Fortes averses", 85: "Averses de neige", 86: "Averses de neige", 95: "Orage", 96: "Orage et grêle", 99: "Orage et grêle" };
const MARINE_CATEGORIES = ["mer_med", "mer_atl", "manche", "crustaces", "cephalopodes", "coquillages"];

async function fetchJson(url, ms) {
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), ms || 12000) : null;
  try {
    const res = await fetch(url, ctrl ? { signal: ctrl.signal } : {});
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { if (timer) clearTimeout(timer); }
}
function daysAgo(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((today - new Date(y, m - 1, d)) / 86400000);
}
function hourlyValue(h, key, hour) {
  if (!h || !Array.isArray(h.time) || !h[key]) return null;
  let i = h.time.findIndex((t) => parseInt(String(t).slice(11, 13), 10) === hour);
  if (i < 0) i = Math.min(12, h.time.length - 1);
  const val = h[key][i];
  return val === null || val === undefined ? null : val;
}
async function fetchWeather(lat, lng, dateStr, hour) {
  const age = daysAgo(dateStr);
  if (age < -14) throw new Error("trop loin");
  const base = age > 60 ? "https://archive-api.open-meteo.com/v1/archive" : "https://api.open-meteo.com/v1/forecast";
  const url = `${base}?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`
    + "&hourly=temperature_2m,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m";
  const data = await fetchJson(url);
  const h = data && data.hourly;
  const w = { temp: hourlyValue(h, "temperature_2m", hour), code: hourlyValue(h, "weather_code", hour), pressure: hourlyValue(h, "pressure_msl", hour),
    wind: hourlyValue(h, "wind_speed_10m", hour), dir: hourlyValue(h, "wind_direction_10m", hour) };
  if (w.temp === null && w.code === null && w.pressure === null) throw new Error("vide");
  return w;
}
async function fetchSeaTemp(lat, lng, dateStr, hour) {
  const age = daysAgo(dateStr);
  if (age > 60 || age < -7) return null;
  const data = await fetchJson(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&timezone=auto&start_date=${dateStr}&end_date=${dateStr}&hourly=sea_surface_temperature`, 10000);
  return hourlyValue(data && data.hourly, "sea_surface_temperature", hour);
}
async function fillWeather() {

    if (isNaN(hour)) hour = 12;

    try {
      const w = await fetchWeather(lat, lng, dateStr, hour);
      const desc = [w.code !== null && WMO_FR[w.code] ? WMO_FR[w.code] : "", w.temp !== null ? `${Math.round(w.temp)}°C` : ""].filter(Boolean).join(", ");
      if (desc) setv("f-meteo", desc);
      if (w.wind !== null) setv("f-vent", `${Math.round(w.wind)} km/h${w.dir !== null ? " " + windDirFr(w.dir) : ""}`);
      if (w.pressure !== null) setv("f-pression", Math.round(w.pressure));
      let extra = "";
      const sp = speciesById(val("f-espece"));
      if (sp && MARINE_CATEGORIES.includes(sp.categorie) && !val("f-tempEau")) {
        try { const sst = await fetchSeaTemp(lat, lng, dateStr, hour); if (sst !== null) { setv("f-tempEau", (Math.round(sst * 10) / 10).toString()); extra = " + température de l'eau"; } } catch (e) {}
      }

    } catch (e) {

    }
  } finally { if (btn) btn.disabled = false; }
}

  if (ctx.measureText(text).width <= maxWidth) return text;
